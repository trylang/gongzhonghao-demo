<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档结构补全工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: auto;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 150px;
        }
        button {
            margin-top: 20px;
            padding: 15px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover {
            background-color: #357abD;
        }
        .loading {
            margin-top: 20px;
            font-size: 18px;
            color: #4a90e2;
        }
        .error {
            margin-top: 20px;
            color: red;
            font-weight: bold;
        }
        .result {
            margin-top: 20px;
            white-space: pre-wrap;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <header>
        <h1>文档结构补全工具</h1>
    </header>
    <main>
        <form id="documentForm">
            <label for="productDescription">产品描述:</label>
            <textarea id="productDescription" name="productDescription" placeholder="请输入您的产品描述..." required></textarea>

            <label for="documentType">文档类型:</label>
            <select id="documentType" name="documentType" required>
                <option value="" disabled selected>请选择文档类型</option>
                <option value="教程">教程 (Tutorials)</option>
                <option value="操作指南">操作指南 (How-to Guides)</option>
                <option value="技术参考">技术参考 (Technical Reference)</option>
                <option value="原理阐述">原理阐述 (Explanation)</option>
            </select>

            <button type="submit">生成补全建议</button>
        </form>

        <div id="loading" class="loading" style="display: none;">生成中，请稍候...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="result" class="result" style="display: none;"></div>
    </main>

    <script>
        document.getElementById('documentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').style.display = 'none';

            const productDescription = document.getElementById('productDescription').value;
            const documentType = document.getElementById('documentType').value;

            const data = {
                productDescription: productDescription,
                documentType: documentType
            };

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('网络响应不正常');
                }

                const result = await response.json();
                document.getElementById('result').textContent = result.result;
                document.getElementById('result').style.display = 'block';
            } catch (error) {
                document.getElementById('error').textContent = '发生错误: ' + error.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html
