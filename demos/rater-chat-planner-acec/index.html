<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>中小企业AI工具自选货架</title>
    <style>
        /* 复制粘贴设计系统 CSS */
        :root{
          --bg:#f6f3ee; --card:#fffdfa; --ink:#3a352f; --ink-soft:#756c64; --muted:#8a7f76;
          --accent:#a65d4c; --accent-deep:#6d453a; --accent-soft:#f3e7e1;
          --line:#e6ded3; --line-strong:#d8cdbc;
          --ok:#4a7c59; --warn:#b42318; --info:#4f8cff;
          --radius:16px; --radius-sm:10px;
          --shadow:0 10px 30px rgba(109,69,58,.08);
          --maxw:1080px;
        }
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--ink);
          font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Songti SC",serif;
          line-height:1.7;-webkit-font-smoothing:antialiased}
        .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

        /* hero 顶部价值主张 */
        .hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fbf4ee;padding:46px 0 38px;text-align:center}
        .hero .kicker{letter-spacing:2px;font-size:12.5px;opacity:.85;margin:0 0 10px}
        .hero h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 12px;font-weight:600}
        .hero .sub{max-width:720px;margin:0 auto;opacity:.92;font-size:14.5px}
        .hero .sub strong{color:#ffe2d3}

        /* 区块 / 卡片 */
        main{padding:30px 0 56px}
        .panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px}
        .card h2,.panel h2{margin:0 0 4px;font-size:17px;color:var(--accent-deep)}
        .card .hint,.panel .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}

        /* 双栏布局 */
        .layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
        @media(max-width:860px){.layout{grid-template-columns:1fr}}

        /* 输入卡 */
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .field{display:flex;flex-direction:column;gap:6px}
        .field>span,.field>label{font-size:13px;color:var(--ink-soft)}
        .field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:#fff;color:var(--ink)}
        .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

        /* 按钮 */
        .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
        .btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .08s,opacity .2s}
        .btn:active{transform:translateY(1px)}
        .btn.primary{background:var(--accent);color:#fff;font-weight:600}
        .btn.primary.big{padding:13px 24px;font-size:15.5px}
        .btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
        .btn:disabled{opacity:.5;cursor:not-allowed}

        /* 胶囊 */
        .pill{border:1px solid var(--line);background:#fff;color:var(--accent-deep);padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
        .pill:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
        .pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

        /* 结果可视化 */
        .results{display:grid;gap:16px}
        .result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
        .result-card h3{margin:0 0 8px;color:var(--accent-deep)}
        .result-card .rc-body{white-space:pre-wrap;font-size:14.5px;line-height:1.75}

        /* 底部理念 */
        .foot{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:22px}
        .foot strong{color:var(--accent-deep)}
    </style>
</head>
<body>
    <div id="data-intake"></div>
    <div class="wrap">
        <div class="hero">
            <div class="kicker">AI工具指南</div>
            <h1>中小企业AI工具自选货架</h1>
            <div class="sub">AI不是万能的，但选对工具能让你的业务流程更高效。<strong>降本、获客、合规</strong>，我们为你精选了20个开箱即用的AI解决方案。</div>
        </div>

        <main>
            <div class="layout">
                <div class="card">
                    <h2>选择你的需求</h2>
                    <div class="form-grid">
                        <div class="field">
                            <label for="category">分类</label>
                            <select id="category" name="category">
                                <option value="cost-reduction">降本</option>
                                <option value="customer_acquisition">获客</option>
                                <option value="compliance">合规</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="complexity">上手难度</label>
                            <select id="complexity" name="complexity">
                                <option value="low">低</option>
                                <option value="medium">中</option>
                                <option value="high">高</option>
                            </select>
                        </div>
                        <div class="field wide">
                            <label for="search">搜索工具</label>
                            <input type="text" id="search" name="search" placeholder="输入关键词搜索">
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn primary" id="generate">生成工具列表</button>
                        <button class="btn ghost" id="clear">清空</button>
                    </div>
                </div>

                <div class="card">
                    <h2>推荐工具</h2>
                    <div class="results" id="results">
                        <div class="result-card">
                            <h3>示例工具：AI内容生成器</h3>
                            <div class="rc-body">
                                <p><strong>成本估算：</strong>每月$50</p>
                                <p><strong>上手难度：</strong>低</p>
                                <p><strong>描述：</strong>使用AI技术快速生成高质量内容，适合博客文章、产品描述等。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="foot">
        <strong>AI工具自选货架</strong>：让AI成为你的得力助手，而不是负担。
    </div>

    <script>
        // 种子数据
        const SEED = {
            "category": "cost-reduction",
            "complexity": "low",
            "search": ""
        };

        // 示例结果
        const EXAMPLE_RESULT = `
            <div class="result-card">
                <h3>AI内容生成器</h3>
                <div class="rc-body">
                    <p><strong>成本估算：</strong>每月$50</p>
                    <p><strong>上手难度：</strong>低</p>
                    <p><strong>描述：</strong>使用AI技术快速生成高质量内容，适合博客文章、产品描述等。</p>
                </div>
            </div>
            <div class="result-card">
                <h3>智能客服机器人</h3>
                <div class="rc-body">
                    <p><strong>成本估算：</strong>每月$100</p>
                    <p><strong>上手难度：</strong>中</p>
                    <p><strong>描述：</strong>通过AI技术提供24/7的客户服务，提升客户满意度。</p>
                </div>
            </div>
        `;

        // 数据入口组件
        window.DATA_SCHEMA = {
            name: "AI工具选择",
            columns: [
                {key:"category", label:"分类", type:"select", options:["cost-reduction", "customer_acquisition", "compliance"], required:true},
                {key:"complexity", label:"上手难度", type:"select", options:["low", "medium", "high"], required:true},
                {key:"search", label:"搜索", type:"text", example:"AI", required:false}
            ],
            sample: [
                {category: "cost-reduction", complexity: "low", search: ""},
                {category: "customer_acquisition", complexity: "medium", search: "digital marketing"},
                {category: "compliance", complexity: "high", search: "data privacy"}
            ],
            maxRows: 300
        };

        // 生成按钮事件
        document.getElementById('generate').addEventListener('click', () => {
            const category = document.getElementById('category').value;
            const complexity = document.getElementById('complexity').value;
            const search = document.getElementById('search').value;

            const inputs = {
                category: category,
                complexity: complexity,
                search: search
            };

            // 检查数据入口组件是否准备好
            if (window.DataIntake && window.DataIntake.isReady()) {
                inputs.data = window.DataIntake.getPayload();
            }

            fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ inputs: inputs })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('results').innerHTML = data.result;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = '<div class="result-card"><h3>发生错误，请稍后再试。</h3></div>';
            });
        });

        // 清空按钮事件
        document.getElementById('clear').addEventListener('click', () => {
            document.getElementById('category').value = SEED.category;
            document.getElementById('complexity').value = SEED.complexity;
            document.getElementById('search').value = SEED.search;
            document.getElementById('results').innerHTML = '';
        });

        // 初始化页面时显示示例结果
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('results').innerHTML = EXAMPLE_RESULT;
        });
    </script>
</body>
</html>
