<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>代州黄酒短视频脚本批量生成器</title>
    <style>
        :root {
            --main-color: #6B4E2A;
            --background-color: #F9F5F1;
            --text-color: #333;
            --button-color: #D9B384;
            --button-hover-color: #C69250;
            --border-color: #E0D1C0;
            --input-color: #FFFFFF;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--main-color);
            color: #FFFFFF;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2em;
        }
        .container {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 40px;
        }
        .section h2 {
            border-bottom: 2px solid var(--main-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-group > div {
            flex: 1 1 300px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--input-color);
            box-shadow: var(--box-shadow);
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .button-group button {
            flex: 1 1 150px;
            padding: 12px;
            border: none;
            border-radius: var(--border-radius);
            background-color: var(--button-color);
            color: #FFFFFF;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button-group button:hover {
            background-color: var(--button-hover-color);
        }
        .result-panel {
            background-color: #FFFFFF;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        .result-panel h3 {
            margin-top: 0;
        }
        .result-panel pre {
            background-color: #F5F5F5;
            padding: 15px;
            border-radius: var(--border-radius);
            overflow-x: auto;
        }
        .example-result {
            margin-bottom: 20px;
        }
        .example-result h4 {
            margin-bottom: 10px;
            color: var(--main-color);
        }
        .example-result .card {
            background-color: #FDF6E3;
            padding: 15px;
            border-left: 5px solid var(--main-color);
            border-radius: 4px;
        }
        .example-result .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .example-result .table th, .example-result .table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }
        .example-result .table th {
            background-color: var(--main-color);
            color: #FFFFFF;
        }
        .footer {
            text-align: center;
            padding: 15px;
            background-color: var(--main-color);
            color: #FFFFFF;
        }
        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="data-intake"></div>
    <script>
        window.DATA_SCHEMA = {
            name: "短视频脚本生成数据",
            columns: [
                { key: "product_name", label: "产品名称", type: "text", example: "代州黄酒", required: true },
                { key: "target_audience", label: "目标受众", type: "text", example: "中年男性", required: true },
                { key: "product_feature", label: "产品特点", type: "text", example: "传统工艺酿造", required: true },
                { key: "selling_point", label: "卖点", type: "text", example: "历史悠久，口感醇厚", required: true },
                { key: "duration", label: "视频时长", type: "select", options: ["30秒", "60秒"], example: "30秒", required: true }
            ],
            sample: [
                { product_name: "代州黄酒", target_audience: "中年男性", product_feature: "传统工艺酿造", selling_point: "历史悠久，口感醇厚", duration: "30秒" },
                { product_name: "代州黄酒", target_audience: "年轻人", product_feature: "低度健康", selling_point: "清爽怡人，适合聚会", duration: "60秒" },
                { product_name: "代州黄酒", target_audience: "女性消费者", product_feature: "美容养颜", selling_point: "天然成分，美容佳品", duration: "30秒" }
            ],
            maxRows: 100
        };
    </script>
    <div class="container">
        <header>
            <h1>代州黄酒短视频脚本批量生成器</h1>
        </header>
        <div class="section">
            <h2>输入参数</h2>
            <div class="input-group">
                <div>
                    <label for="product_name">产品名称</label>
                    <input type="text" id="product_name" placeholder="例如：代州黄酒">
                </div>
                <div>
                    <label for="target_audience">目标受众</label>
                    <input type="text" id="target_audience" placeholder="例如：中年男性">
                </div>
                <div>
                    <label for="product_feature">产品特点</label>
                    <input type="text" id="product_feature" placeholder="例如：传统工艺酿造">
                </div>
                <div>
                    <label for="selling_point">卖点</label>
                    <input type="text" id="selling_point" placeholder="例如：历史悠久，口感醇厚">
                </div>
                <div>
                    <label for="duration">视频时长</label>
                    <select id="duration">
                        <option value="30秒">30秒</option>
                        <option value="60秒">60秒</option>
                    </select>
                </div>
            </div>
            <div class="button-group">
                <button id="generate-btn">生成脚本</button>
                <button id="clear-btn">清空/重填</button>
                <button id="scenario-a-btn">场景预设A</button>
                <button id="scenario-b-btn">场景预设B</button>
                <button id="scenario-c-btn">场景预设C</button>
                <button id="random-example-btn">随机示例</button>
            </div>
        </div>
        <div class="section">
            <h2>示例结果</h2>
            <div id="example-result" class="example-result">
                <h4>示例脚本</h4>
                <div class="card">
                    <p>【30秒脚本】</p>
                    <p>大家好，今天我要向大家推荐一款历史悠久的酒——代州黄酒。它采用传统工艺酿造，口感醇厚，是您聚会宴请的不二选择。快来试试吧！</p>
                </div>
                <h4>分镜描述</h4>
                <div class="table">
                    <thead>
                        <tr>
                            <th>镜头</th>
                            <th>描述</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>展示代州黄酒的瓶身和标签</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>展示酿造过程的画面</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>展示人们品尝黄酒的场景</td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>展示代州黄酒的特写镜头</td>
                        </tr>
                    </tbody>
                </div>
            </div>
        </div>
        <div class="section">
            <h2>生成结果</h2>
            <div id="generated-result" class="result-panel">
                <p>点击“生成脚本”按钮后，脚本将显示在这里。</p>
            </div>
            <div class="button-group">
                <button id="copy-btn">复制结果</button>
                <button id="export-btn">导出 JSON</button>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>© 2023 你的公司名称. 版权所有.</p>
    </div>
    <script>
        // JavaScript部分
        const SEED = [
            { product_name: "代州黄酒", target_audience: "中年男性", product_feature: "传统工艺酿造", selling_point: "历史悠久，口感醇厚", duration: "30秒" },
            { product_name: "代州黄酒", target_audience: "年轻人", product_feature: "低度健康", selling_point: "清爽怡人，适合聚会", duration: "60秒" },
            { product_name: "代州黄酒", target_audience: "女性消费者", product_feature: "美容养颜", selling_point: "天然成分，美容佳品", duration: "30秒" },
            // 更多示例数据...
        ];

        document.getElementById('generate-btn').addEventListener('click', () => {
            const inputs = {
                product_name: document.getElementById('product_name').value || "代州黄酒",
                target_audience: document.getElementById('target_audience').value || "中年男性",
                product_feature: document.getElementById('product_feature').value || "传统工艺酿造",
                selling_point: document.getElementById('selling_point').value || "历史悠久，口感醇厚",
                duration: document.getElementById('duration').value || "30秒"
            };
            if (window.DataIntake && window.DataIntake.isReady()) {
                inputs.data = window.DataIntake.getPayload();
            }
            fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ inputs: inputs })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('generated-result').innerHTML = `
                    <h4>生成的脚本</h4>
                    <div class="card">
                        <p>【${data.duration}脚本】</p>
                        <p>${data.script}</p>
                    </div>
                    <h4>分镜描述</h4>
                    <div class="table">
                        <thead>
                            <tr>
                                <th>镜头</th>
                                <th>描述</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.storyboard.map(scene => `<tr>
                                <td>${scene.lens}</td>
                                <td>${scene.description}</td>
                            </tr>`).join('')}
                        </tbody>
                    </div>
                `;
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            document.getElementById('product_name').value = "";
            document.getElementById('target_audience').value = "";
            document.getElementById('product_feature').value = "";
            document.getElementById('selling_point').value = "";
            document.getElementById('duration').value = "";
            document.getElementById('generated-result').innerHTML = "<p>点击“生成脚本”按钮后，脚本将显示在这里。</p>";
        });

        document.getElementById('scenario-a-btn').addEventListener('click', () => {
            document.getElementById('product_name').value = "代州黄酒";
            document.getElementById('target_audience').value = "中年男性";
            document.getElementById('product_feature').value = "传统工艺酿造";
            document.getElementById('selling_point').value = "历史悠久，口感醇厚";
            document.getElementById('duration').value = "30秒";
        });

        document.getElementById('scenario-b-btn').addEventListener('click', () => {
            document.getElementById('product_name').value = "代州黄酒";
            document.getElementById('target_audience').value = "年轻人";
            document.getElementById('product_feature').value = "低度健康";
            document.getElementById('selling_point').value = "清爽怡人，适合聚会";
            document.getElementById('duration').value = "60秒";
        });

        document.getElementById('scenario-c-btn').addEventListener('click', () => {
            document.getElementById('product_name').value = "代州黄酒";
            document.getElementById('target_audience').value = "女性消费者";
            document.getElementById('product_feature').value = "美容养颜";
            document.getElementById('selling_point').value = "天然成分，美容佳品";
            document.getElementById('duration').value = "30秒";
        });

        document.getElementById('random-example-btn').addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * SEED.length);
            const data = SEED[randomIndex];
            document.getElementById('product_name').value = data.product_name;
            document.getElementById('target_audience').value = data.target_audience;
            document.getElementById('product_feature').value = data.product_feature;
            document.getElementById('selling_point').value = data.selling_point;
            document.getElementById('duration').value = data.duration;
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            const result = document.getElementById('generated-result').innerText;
            navigator.clipboard.writeText(result);
            alert('结果已复制到剪贴板');
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            const result = document.getElementById('generated-result').innerText;
            const blob = new Blob([result], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'script.json';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
