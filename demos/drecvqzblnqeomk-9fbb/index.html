<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI创业景气指数对比仪表盘</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #7f8c8d;
            margin-top: 20px;
        }
        .error {
            color: #e74c3c;
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
        }
        .result {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI创业景气指数对比仪表盘</h1>
        <form id="generate-form">
            <div class="form-group">
                <label for="industry">所属行业</label>
                <select id="industry" name="industry">
                    <option value="零售">零售</option>
                    <option value="制造">制造</option>
                    <option value="服务">服务</option>
                    <option value="科技">科技</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label for="region">所在地区</label>
                <input type="text" id="region" name="region" placeholder="例如：北京">
            </div>
            <div class="form-group">
                <label for="scale">企业规模</label>
                <select id="scale" name="scale">
                    <option value="1-10人">1-10人</option>
                    <option value="11-50人">11-50人</option>
                    <option value="51-100人">51-100人</option>
                    <option value="101-500人">101-500人</option>
                    <option value="500人以上">500人以上</option>
                </select>
            </div>
            <div class="form-group">
                <label for="goal">目标</label>
                <textarea id="goal" name="goal" rows="3" placeholder="例如：提升销售额20%"></textarea>
            </div>
            <button type="submit">生成 / 运行</button>
        </form>
        <div id="result-section" style="display:none;">
            <div class="result" id="result-content"></div>
        </div>
        <div class="loading" id="loading" style="display:none;">生成中，请稍候...</div>
        <div class="error" id="error-message" style="display:none;"></div>
    </div>
    <script>
        document.getElementById('generate-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if(data.result){
                    document.getElementById('result-content').textContent = data.result;
                    document.getElementById('result-section').style.display = 'block';
                } else {
                    document.getElementById('error-message').textContent = '生成失败，请重试。';
                    document.getElementById('error-message').style.display = 'block';
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-message').textContent = '网络错误，请稍后再试。';
                document.getElementById('error-message').style.display = 'block';
            });
        });
    </script>
</body>
</html
