<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>中小企业AI工具自选货架</title>
<style>
/* === 粘贴设计系统 CSS === */
:root{
  --bg:#f6f3ee; --card:#fffdfa; --ink:#3a352f; --ink-soft:#756c64; --muted:#8a7f76;
  --accent:#a65d4c; --accent-deep:#6d453a; --accent-soft:#f3e7e1;
  --line:#e6ded3; --line-strong:#d8cdbc;
  --ok:#4a7c59; --warn:#b42318; --info:#4f8cff;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(109,69,58,.08);
  --maxw:1080px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Songti SC",serif;
  line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* hero 顶部价值主张（禁止只放一个孤零零的 h1） */
.hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fbf4ee;padding:46px 0 38px;text-align:center}
.hero .kicker{letter-spacing:2px;font-size:12.5px;opacity:.85;margin:0 0 10px}
.hero h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 12px;font-weight:600}
.hero .sub{max-width:720px;margin:0 auto;opacity:.92;font-size:14.5px}
.hero .sub strong{color:#ffe2d3}

/* 区块 / 卡片 */
main{padding:30px 0 56px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px}
.card h2,.panel h2{margin:0 0 4px;font-size:17px;color:var(--accent-deep)}
.card .hint,.panel .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}

/* 双栏布局：左输入卡 / 右结果卡 */
.layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

/* 表单（最小必要字段，优先 select/预设） */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field>span,.field>label{font-size:13px;color:var(--ink-soft)}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 按钮（唯一主按钮 + 少量次要 + 胶囊示例） */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary.big{padding:13px 24px;font-size:15.5px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 胶囊 / 选项卡 / 标签（标杆通用交互件） */
.pill,.tab,.chip{border:1px solid var(--line);background:#fff;color:var(--accent-deep);padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.pill:hover,.tab:hover,.chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab.active,.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep)}
.tag.ok{background:rgba(74,124,89,.16);color:var(--ok)}
.tag.warn{background:rgba(180,35,24,.14);color:var(--warn)}
.tag.muted{background:#eee3d6;color:var(--muted)}

/* 结果可视化（禁止死表格/纯文本） */
.results{display:grid;gap:16px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
.result-card h3,.result-card h4{margin:0 0 8px;color:var(--accent-deep)}
.result-card .rc-body{white-space:pre-wrap;font-size:14.5px;line-height:1.75}

/* 分类标签 */
.category-tags{margin-bottom:16px}
.category-tags .tag{margin-right:8px}

/* 货架布局 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.item-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.item-card h3{margin:0 0 8px;font-size:16px;color:var(--accent-deep)}
.item-card .details{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.item-card .details .cost{font-size:13px;color:var(--muted)}
.item-card .details .difficulty{font-size:13px;color:var(--accent)}
.item-card .description{font-size:13.5px;line-height:1.6;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="hero">
  <div class="wrap">
    <div class="kicker">AI 工具导航</div>
    <h1>中小企业 AI 工具自选货架</h1>
    <div class="sub">为传统企业老板提供 20 个开箱即用的 AI 解决方案，涵盖降本、获客、合规三大方向，助您轻松选择最合适的 AI 工具。</div>
  </div>
</div>
<div class="wrap">
  <div id="data-intake"></div>
  <div class="shelf" id="shelf">
    <!-- 示例货架项 -->
    <div class="item-card">
      <h3>智能客服机器人</h3>
      <div class="details">
        <span class="cost">成本：¥5,000/月</span>
        <span class="difficulty">上手难度：⭐⭐</span>
      </div>
      <div class="description">通过自然语言处理技术，自动处理客户咨询，提升客户服务效率。</div>
    </div>
    <!-- 更多货架项 -->
  </div>
  <div class="actions">
    <button class="btn primary" id="generate">生成货架</button>
    <button class="btn ghost" id="clear">清空</button>
  </div>
  <div class="status" id="status"></div>
  <div class="results" id="results"></div>
</div>
<div class="foot">
  <p><strong>AI 工具选择理念：</strong>AI 不提供结论性动作，最后那一下由您点击。</p>
</div>

<script>
const SEED = [
  {
    name: "智能客服机器人",
    cost: "¥5,000/月",
    difficulty: "⭐⭐",
    description: "通过自然语言处理技术，自动处理客户咨询，提升客户服务效率。",
    category: "降本"
  },
  {
    name: "AI 销售预测",
    cost: "¥10,000/月",
    difficulty: "⭐⭐⭐",
    description: "利用机器学习算法，预测销售趋势，优化库存管理。",
    category: "获客"
  },
  {
    name: "合规性检查工具",
    cost: "¥3,000/月",
    difficulty: "⭐⭐",
    description: "自动检测文档和流程中的合规性问题，降低法律风险。",
    category: "合规"
  }
  // 更多示例数据...
];

window.DATA_SCHEMA = {
  name: "AI 工具信息",
  columns: [
    { key: "name", label: "工具名称", type: "text", example: "智能客服机器人", required: true },
    { key: "cost", label: "成本", type: "text", example: "¥5,000/月", required: true },
    { key: "difficulty", label: "上手难度", type: "text", example: "⭐⭐", required: true },
    { key: "description", label: "描述", type: "text", example: "通过自然语言处理技术，自动处理客户咨询，提升客户服务效率。", required: true },
    { key: "category", label: "分类", type: "text", example: "降本", required: true }
  ],
  sample: [
    // 示例数据行
  ],
  maxRows: 300
};

// 获取元素
const shelf = document.getElementById("shelf");
const generateBtn = document.getElementById("generate");
const clearBtn = document.getElementById("clear");
const status = document.getElementById("status");
const results = document.getElementById("results");

// 填充示例数据
function fillSeed() {
  shelf.innerHTML = "";
  SEED.forEach(item => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `
      <h3>${item.name}</h3>
      <div class="details">
        <span class="cost">成本：${item.cost}</span>
        <span class="difficulty">上手难度：${item.difficulty}</span>
      </div>
      <div class="description">${item.description}</div>
    `;
    shelf.appendChild(card);
  });
}

// 生成货架
generateBtn.addEventListener("click", () => {
  status.innerHTML = "生成中...";
  fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ inputs: { data: window.DataIntake && window.DataIntake.isReady() ? window.DataIntake.getPayload() : SEED } })
  })
    .then(response => response.json())
    .then(data => {
      status.innerHTML = "";
      results.innerHTML = "";
      const shelfData = data.result;
      shelfData.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <h3>${item.name}</h3>
          <div class="details">
            <span class="cost">成本：${item.cost}</span>
            <span class="difficulty">上手难度：${item.difficulty}</span>
          </div>
          <div class="description">${item.description}</div>
        `;
        shelf.appendChild(card);
      });
    })
    .catch(error => {
      status.innerHTML = "生成失败，请重试。";
      console.error(error);
    });
});

// 清空货架
clearBtn.addEventListener("click", () => {
  shelf.innerHTML = "";
  status.innerHTML = "";
  results.innerHTML = "";
  fillSeed();
});

// 初始填充
fillSeed();
</script>
</body>
</html>
