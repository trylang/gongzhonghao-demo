<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --main-color: #d68f42;
            --background-color: #f9f5f0;
            --text-color: #3a3a3a;
            --border-color: #e0dcd4;
            --button-color: #f9f0e8;
            --button-hover-color: #f3e3cf;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --font-family: 'Arial, sans-serif';
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--main-color);
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section {
            background-color: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px var(--shadow-color);
        }

        .section h2 {
            margin-top: 0;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .controls button {
            flex: 1 1 150px;
            padding: 10px;
            border: none;
            border-radius: var(--border-radius);
            background-color: var(--button-color);
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .controls button:hover {
            background-color: var(--button-hover-color);
        }

        .data-intake {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .data-intake .buttons {
            display: flex;
            gap: 10px;
        }

        .data-intake .buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--border-radius);
            background-color: var(--button-color);
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .data-intake .buttons button:hover {
            background-color: var(--button-hover-color);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .results .example-result {
            background-color: #fff9f0;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px var(--shadow-color);
        }

        .results .example-result h3 {
            margin-top: 0;
            color: var(--main-color);
        }

        .results .example-result p {
            margin: 0;
        }

        .results .generated-result {
            background-color: #f0f8ff;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px var(--shadow-color);
        }

        .results .generated-result h3 {
            margin-top: 0;
            color: #1e90ff;
        }

        .results .generated-result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        footer {
            background-color: var(--main-color);
            color: white;
            text-align: center;
            padding: 10px;
        }

        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>

        <div class="controls">

            <button id="exportJSONButton">导出 JSON</button>

            <button id="scenarioAButton">场景A</button>

        </div>
        <div class="section">
            <h2>示例结果</h2>
            <div id="exampleResult" class="example-result">
                <h3>示例脚本</h3>
                <p>（点击“生成”按钮查看示例结果）</p>
            </div>
        </div>
        <div class="section">
            <h2>生成结果</h2>
            <div id="generatedResult" class="generated-result">
                <h3>生成脚本</h3>
                <pre id="resultPre">（点击“生成”按钮后显示结果）</pre>
            </div>
        </div>
    </main>

            const dataIntake = window.DataIntake;
            if (dataIntake && dataIntake.isReady()) {
                inputs.data = dataIntake.getPayload();
            }

            fetch("/api/generate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ "inputs": inputs })
            })
            .then(response => response.json())
            .then(data => {
                // 解析并渲染结果
                const result = data;
                document.getElementById("resultPre").textContent = JSON.stringify(result, null, 2);
                document.getElementById("generatedResult").style.display = "block";
            })
            .catch(error => {
                console.error("Error:", error);
            });
        });

        // 清空/重填按钮事件
        document.getElementById("clearButton").addEventListener("click", () => {
            document.getElementById("input卖点").value = "";
            document.getElementById("resultPre").textContent = "（点击“生成”按钮后显示结果）";
            document.getElementById("generatedResult").style.display = "none";
        });

        // 复制结果按钮事件
        document.getElementById("copyResultButton").addEventListener("click", () => {
            const result = document.getElementById("resultPre").textContent;
            navigator.clipboard.writeText(result)
                .then(() => {
                    alert("结果已复制到剪贴板");
                })
                .catch(error => {
                    console.error("Error:", error);
                });
        });

        // 导出 JSON 按钮事件
        document.getElementById("exportJSONButton").addEventListener("click", () => {
            const result = document.getElementById("resultPre").textContent;
            const blob = new Blob([result], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "result.json";
            a.click();
            URL.revokeObjectURL(url);
        });
