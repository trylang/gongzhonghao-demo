<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>代州黄酒短视频脚本批量生成器</title>
    <style>
        :root {
            --main-color: #4A90E2;
            --bg-color: #F5F5F5;
            --text-color: #333333;
            --border-radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--main-color);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: var(--border-radius);
            box-sizing: border-box;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--border-radius);
            background-color: var(--main-color);
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .buttons button:hover {
            background-color: #357ABD;
        }
        .result {
            margin-top: 30px;
        }
        .result-card {
            border: 1px solid #dddddd;
            padding: 15px;
            border-radius: var(--border-radius);
            background-color: #fafafa;
        }
        .result-card h2 {
            margin-top: 0;
            color: var(--main-color);
        }
        .table-wrapper {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th, table td {
            padding: 8px;
            border: 1px solid #dddddd;
            text-align: left;
        }
        table th {
            background-color: #f2f2f2;
        }
        @media (max-width: 600px) {
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="data-intake"></div>
    <div class="container">
        <h1>代州黄酒短视频脚本批量生成器</h1>
        <div class="input-group">
            <label for="product-feature">产品卖点</label>
            <input type="text" id="product-feature" placeholder="例如：传统工艺酿造，口感醇厚">
        </div>
        <div class="buttons">
            <button id="generate-btn">生成脚本</button>
            <button id="clear-btn">清空/重填</button>
            <button id="copy-btn">复制结果</button>
            <button id="export-btn">导出 JSON</button>
            <button id="random-btn">随机示例</button>
            <button id="preset-a-btn">场景A</button>
            <button id="preset-b-btn">场景B</button>
            <button id="preset-c-btn">场景C</button>
        </div>
        <div class="result" id="result">
            <div class="result-card">
                <h2>示例结果</h2>
                <p>（点击“生成”或选择一个场景预设以查看示例）</p>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>脚本类型</th>
                                <th>内容</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>30秒口播脚本</td>
                                <td>示例内容：代州黄酒，传承百年工艺，醇香浓郁，回味无穷。</td>
                            </tr>
                            <tr>
                                <td>60秒口播脚本</td>
                                <td>示例内容：代州黄酒，源自传统酿造工艺，选用优质原料，口感醇厚，层次丰富。无论是家庭聚会还是商务宴请，都是您的理想选择。</td>
                            </tr>
                            <tr>
                                <td>分镜脚本</td>
                                <td>示例内容：镜头1：代州黄酒酒瓶特写，背景为传统酒坊。镜头2：酿酒师手工酿造过程。镜头3：黄酒倒入杯中，酒液清澈透亮。镜头4：人们举杯共饮，笑容满面。</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script>
        // 示例数据
        const SEED = {
            "场景A": {
                "product_feature": "传统工艺酿造，口感醇厚",
                "scripts": {
                    "30秒口播脚本": "代州黄酒，传承百年工艺，醇香浓郁，回味无穷。",
                    "60秒口播脚本": "代州黄酒，源自传统酿造工艺，选用优质原料，口感醇厚，层次丰富。无论是家庭聚会还是商务宴请，都是您的理想选择。",
                    "分镜脚本": "镜头1：代州黄酒酒瓶特写，背景为传统酒坊。镜头2：酿酒师手工酿造过程。镜头3：黄酒倒入杯中，酒液清澈透亮。镜头4：人们举杯共饮，笑容满面。"
                }
            },
            "场景B": {
                "product_feature": "健康养生，富含多种营养",
                "scripts": {
                    "30秒口播脚本": "代州黄酒，富含多种维生素和氨基酸，健康养生，老少皆宜。",
                    "60秒口播脚本": "代州黄酒，采用天然原料，富含多种维生素和氨基酸，具有抗氧化、促进新陈代谢的功效。无论是日常饮用还是馈赠亲友，都是您的健康之选。",
                    "分镜脚本": "镜头1：代州黄酒酒瓶特写，背景为自然风光。镜头2：营养成分表展示。镜头3：人们饮用黄酒，活力四射。镜头4：代州黄酒礼盒包装，温馨家庭场景。"
                }
            },
            "场景C": {
                "product_feature": "历史悠久，文化传承",
                "scripts": {
                    "30秒口播脚本": "代州黄酒，百年传承，历史悠久，承载着深厚的文化底蕴。",
                    "60秒口播脚本": "代州黄酒，拥有数百年的历史，承载着丰富的文化内涵。从古代的皇家贡品到现代的餐桌佳酿，代州黄酒始终是品质的象征。",
                    "分镜脚本": "镜头1：古代酒坊场景复原。镜头2：代州黄酒历史文献资料展示。镜头3：现代酿酒工艺流程。镜头4：代州黄酒在各种文化活动中的展示。"
                }
            }
        };

        // 场景预设按钮
        const presetButtons = document.querySelectorAll('.buttons button[id^="preset-"]');
        presetButtons.forEach(button => {
            button.addEventListener('click', () => {
                const scenario = button.id.replace('preset-', '').replace('btn', '');
                const data = SEED[scenario];
                document.getElementById('product-feature').value = data.product_feature;
                renderResult(data.scripts);
            });
        });

        // 生成按钮
        document.getElementById('generate-btn').addEventListener('click', () => {
            const productFeature = document.getElementById('product-feature').value;
            if (!productFeature) {
                alert('请输入产品卖点');
                return;
            }
            const payload = {
                "inputs": {
                    "product_feature": productFeature
                }
            };
            fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                renderResult(data);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('生成失败，请稍后再试');
            });
        });

        // 清空/重填按钮
        document.getElementById('clear-btn').addEventListener('click', () => {
            document.getElementById('product-feature').value = '';
            document.getElementById('result').innerHTML = `
                <div class="result-card">
                    <h2>示例结果</h2>
                    <p>（点击“生成”或选择一个场景预设以查看示例）</p>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>脚本类型</th>
                                    <th>内容</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>30秒口播脚本</td>
                                    <td>示例内容：代州黄酒，传承百年工艺，醇香浓郁，回味无穷。</td>
                                </tr>
                                <tr>
                                    <td>60秒口播脚本</td>
                                    <td>示例内容：代州黄酒，源自传统酿造工艺，选用优质原料，口感醇厚，层次丰富。无论是家庭聚会还是商务宴请，都是您的理想选择。</td>
                                </tr>
                                <tr>
                                    <td>分镜脚本</td>
                                    <td>示例内容：镜头1：代州黄酒酒瓶特写，背景为传统酒坊。镜头2：酿酒师手工酿造过程。镜头3：黄酒倒入杯中，酒液清澈透亮。镜头4：人们举杯共饮，笑容满面。</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        });

        // 复制结果按钮
        document.getElementById('copy-btn').addEventListener('click', () => {
            const result = document.getElementById('result').innerText;
            navigator.clipboard.writeText(result)
                .then(() => {
                    alert('结果已复制到剪贴板');
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('复制失败');
                });
        });

        // 导出 JSON 按钮
        document.getElementById('export-btn').addEventId2ventListener('click', () => {
            const result = document.getElementById('result').innerText;
            const blob = new Blob([result], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'script.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        // 随机示例按钮
        document.getElementById('random-btn').addEventListener('click', () => {
            const scenarios = Object.keys(SEED);
            const randomScenario = scenarios[Math.floor(Math.random() * scenarios.length)];
            const data = SEED[randomScenario];
            document.getElementById('product-feature').value = data.product_feature;
            renderResult(data.scripts);
        });

        // 渲染结果
        function renderResult(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="result-card">
                    <h2>脚本生成结果</h2>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>脚本类型</th>
                                    <th>内容</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>30秒口播脚本</td>
                                    <td>${data['30秒口播脚本']}</td>
                                </tr>
                                <tr>
                                    <td>60秒口播脚本</td>
                                    <td>${data['60秒口播脚本']}</td>
                                </tr>
                                <tr>
                                    <td>分镜脚本</td>
                                    <td>${data['分镜脚本']}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // 数据入口组件
        window.DATA_SCHEMA = {
            "name": "产品卖点",
            "columns": [
                { "key": "product_feature", "label": "产品卖点", "type": "text", "example": "传统工艺酿造，口感醇厚", "required": true }
            ],
            "sample": [
                { "product_feature": "传统工艺酿造，口感醇厚" },
                { "product_feature": "健康养生，富含多种营养" },
                { "product_feature": "历史悠久，文化传承" }
            ],
            "maxRows": 300
        };
    </script>
</body>
</html>
