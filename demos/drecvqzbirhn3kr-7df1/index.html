<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LLM 路由与缓存对比 Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"; margin: 0; padding: 20px; background-color: #f5f5f5; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background-color: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 30px; color: #2c3e50; }
        form { display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; }
        input[type="text"], select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        textarea { resize: vertical; height: 100px; }
        button { padding: 12px; background-color: #3498db; color: #fff; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #2980b9; }
        .loading { text-align: center; margin-top: 20px; }
        .result { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .result pre { background-color: #ecf0f1; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .error { color: #e74c3c; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>LLM 路由与缓存对比工具</h1>
        <form id="generateForm">
            <div class="form-group">
                <label for="task">任务描述</label>
                <input type="text" id="task" name="task" placeholder="请输入任务描述" required>
            </div>
            <div class="form-group">
                <label for="model">模型选择</label>
                <select id="model" name="model" required>
                    <option value="cheap">Cheap 模型</option>
                    <option value="base">Base 模型</option>
                    <option value="pro">Pro 模型</option>
                    <option value="reasoning">Reasoning 模型</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cache">缓存策略</label>
                <select id="cache" name="cache" required>
                    <option value="enabled">开启缓存</option>
                    <option value="disabled">关闭缓存</option>
                </select>
            </div>
            <button type="submit">生成 / 运行</button>
        </form>

        <div class="loading" id="loading" style="display: none;">
            <p>正在生成中，请稍候...</p>
        </div>

        <div class="result" id="result" style="display: none;">
            <h2>结果对比</h2>
            <pre id="resultContent"></pre>
        </div>

        <div class="error" id="error" style="display: none;">
            <p id="errorMessage"></p>
        </div>
    </div>

    <script>
        document.getElementById('generateForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            const task = document.getElementById('task').value;
            const model = document.getElementById('model').value;
            const cache = document.getElementById('cache').value;

            const data = {
                task: task,
                model: model,
                cache: cache
            };

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('网络响应不正常');
                }

                const result = await response.json();
                document.getElementById('resultContent').textContent = result.result;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';
            } catch (error) {
                document.getElementById('errorMessage').textContent = '发生错误: ' + error.message;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        });
    </script>
</body>
</html
