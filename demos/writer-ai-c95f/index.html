<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>工具</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 id="appTitle">加载中…</h1>
      <p id="appSubtitle" class="subtitle"></p>
    </header>

    <section id="formCard" class="card form-card">
      <form id="form"></form>
      <div class="actions">
        <button id="btnRun" type="submit" form="form" class="btn btn-primary">生成 / 运行</button>
      </div>
    </section>

    <section id="resultCard" class="card result-card hidden">
      <div id="resultOut" class="result-out"></div>
      <div class="actions">
        <button id="btnCopy" class="btn btn-ghost" type="button">复制结果</button>
        <button id="btnDownload" class="btn btn-ghost" type="button">下载 HTML</button>
        <button id="btnReset" class="btn btn-ghost" type="button">重新填写</button>
      </div>
    </section>

    <section id="refineCard" class="card refine-card hidden">
      <h3>补充几点，让结果更准</h3>
      <div id="refineQuestions"></div>
      <div class="actions">
        <button id="btnRefine" class="btn btn-primary" type="button">基于补充生成定稿</button>
      </div>
    </section>

    <div id="status" class="status" role="status"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
