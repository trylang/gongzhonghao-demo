<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 创业工具：生成你的创业计划与指数</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #f5f7fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdcdc;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            padding: 12px;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .loading, .error {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
        }
        .result {
            margin-top: 30px;
            white-space: pre-wrap;
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 创业工具：生成你的创业计划与指数</h1>
        <form id="generateForm">
            <div class="form-group">
                <label for="projectName">项目名称</label>
                <input type="text" id="projectName" name="projectName" placeholder="例如：黄酒项目">
            </div>
            <div class="form-group">
                <label for="strategy">创业策略</label>
                <select id="strategy" name="strategy">
                    <option value="MVP">最小可行产品 (MVP)</option>
                    <option value="完整产品">完整产品</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">项目描述</label>
                <textarea id="description" name="description" rows="4" placeholder="请简要描述您的创业项目，例如：AI 驱动的黄酒销售平台"></textarea>
            </div>
            <div class="form-group">
                <label for="goal">目标</label>
                <textarea id="goal" name="goal" rows="4" placeholder="请描述您的目标，例如：30 天内完成平台搭建并获得 100 个用户"></textarea>
            </div>
            <button type="submit">生成计划</button>
        </form>
        <div class="loading" id="loading" style="display: none;">生成中，请稍候...</div>
        <div class="error" id="error" style="display: none;">发生错误，请稍后重试。</div>
        <div class="result" id="result" style="display: none;"></div>
    </div>
    <script>
        document.getElementById('generateForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').style.display = 'none';

            const formData = {
                projectName: document.getElementById('projectName').value,
                strategy: document.getElementById('strategy').value,
                description: document.getElementById('description').value,
                goal: document.getElementById('goal').value
            };

            fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (data.result) {
                    document.getElementById('result').innerText = data.result;
                    document.getElementid('result').style.display = 'block';
                } else {
                    document.getElementById('error').style.display = 'block';
                }
            })
            .catch(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            });
        });
    </script>
</body>
</html
