<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 效率提升分析工具：2-3 倍真实提效测算</title>
  <style>
:root{
  --bg:#f6f3ee; --card:#fffdfa; --ink:#3a352f; --ink-soft:#756c64; --muted:#8a7f76;
  --accent:#a65d4c; --accent-deep:#6d453a; --accent-soft:#f3e7e1;
  --line:#e6ded3; --line-strong:#d8cdbc;
  --ok:#4a7c59; --warn:#b42318; --info:#4f8cff;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(109,69,58,.08);
  --maxw:1080px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Songti SC",serif;
  line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* hero 顶部价值主张（禁止只放一个孤零零的 h1） */
.hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fbf4ee;padding:46px 0 38px;text-align:center}
.hero .kicker{letter-spacing:2px;font-size:12.5px;opacity:.85;margin:0 0 10px}
.hero h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 12px;font-weight:600}
.hero .sub{max-width:720px;margin:0 auto;opacity:.92;font-size:14.5px}
.hero .sub strong{color:#ffe2d3}

/* 区块 / 卡片 */
main{padding:30px 0 56px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px}
.card h2,.panel h2{margin:0 0 4px;font-size:17px;color:var(--accent-deep)}
.card .hint,.panel .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}

/* 双栏布局：左输入卡 / 右结果卡 */
.layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

/* 表单（最小必要字段，优先 select/预设） */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field>span,.field>label{font-size:13px;color:var(--ink-soft)}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 按钮（唯一主按钮 + 少量次要 + 胶囊示例） */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary.big{padding:13px 24px;font-size:15.5px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 胶囊 / 选项卡 / 标签（标杆通用交互件） */
.pill,.tab,.chip{border:1px solid var(--line);background:#fff;color:var(--accent-deep);padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.pill:hover,.tab:hover,.chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab.active,.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep)}
.tag.ok{background:rgba(74,124,89,.16);color:var(--ok)}
.tag.warn{background:rgba(180,35,24,.14);color:var(--warn)}
.tag.muted{background:#eee3d6;color:var(--muted)}

/* 结果可视化（禁止死表格/纯文本） */
.results{display:grid;gap:16px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
.result-card h3,.result-card h4{margin:0 0 8px;color:var(--accent-deep)}
.result-card .rc-body{white-space:pre-wrap;font-size:14.5px;line-height:1.75}

/* 对比矩阵（标杆通用：ai-landing 等） */
.matrix{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.matrix th,.matrix td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.matrix th{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.matrix tr:nth-child(even) td{background:#fdfbf7}

/* 节点流 / 时间线（流程类 demo 标杆件） */
.node-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 14px}
.node-flow .arrow{color:var(--muted);font-weight:700}
.node{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-width:92px;text-align:center}
.node .node-name{font-size:13px;font-weight:600;margin-bottom:4px}
.timeline{position:relative;margin-left:14px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--accent-soft)}
.tl-step{position:relative;padding:0 0 18px 30px}
.tl-step::before{content:"";position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--accent-soft)}
.tl-step .tl-name{font-weight:600;font-size:15px}
.tl-step .tl-body{margin-top:6px;font-size:13.5px;color:var(--ink-soft)}

/* 汇总卡 / 结论条 */
.summary-card{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.summary-card>div{flex:1;min-width:120px;background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.summary-card .big{display:block;font-size:18px;font-weight:700;color:var(--accent-deep)}
.summary-card label{font-size:12px;color:var(--muted)}
.conclusion{background:rgba(74,124,89,.12);border-left:4px solid var(--ok);padding:10px 14px;border-radius:8px;font-weight:600;color:#36543f}

/* 状态 / 加载 */
.status{font-size:12.5px;color:var(--ink-soft);margin-top:8px;min-height:16px}
.loading{color:var(--ink-soft)}
.error{color:var(--warn)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(168,65,42,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 底部理念 */
.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:22px}
.foot strong{color:var(--accent-deep)}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="data-intake"></div>
  <div class="wrap">
    <div class="hero">
      <div class="kicker">AI 效率提升分析</div>
      <h1>测算您的业务 AI 提效潜力</h1>
      <div class="sub">
        量化 AI 对您的业务流程效率提升的真实影响，识别最值得投入的环节。<strong>别被 10 倍增长叙事误导，AI 的真正红利在于 2-3 倍的真实提效。</strong>
      </div>
    </div>

    <main>
      <div class="layout">
        <div class="card">
          <h2>输入您的业务数据</h2>
          <div class="form-grid">
            <div class="field">
              <label>当前效率提升预期 (%)</label>
              <input type="number" placeholder="例如 20" name="current_efficiency" value="20">
            </div>
            <div class="field">
              <label>AI 预期提升 (%)</label>
              <input type="number" placeholder="例如 10" name="ai_efficiency" value="10">
            </div>
            <div class="field">
              <label>当前年增长率 (%)</label>
              <input type="number" placeholder="例如 5" name="current_growth" value="5">
            </div>
            <div class="field">
              <label>AI 提效后年增长率 (%)</label>
              <input type="number" placeholder="例如 10" name="ai_growth" value="10">
            </div>
            <div class="field wide">
              <label>业务场景描述</label>
              <textarea placeholder="例如：短视频文案制作、客服响应时间" name="scenario" value="短视频文案制作">短视频文案制作</textarea>
            </div>
          </div>
          <div class="actions">
            <button class="btn primary big" id="generate">生成分析报告</button>
            <button class="btn ghost" id="clear">清空</button>
          </div>
        </div>

        <div class="card">
          <h2>AI 提效分析结果</h2>
          <div id="results" class="results">
            <div class="result-card">
              <h3>示例结果</h3>
              <div class="rc-body">
                <p>当前效率提升预期：20%</p>
                <p>AI 预期提升：10%</p>
                <p>当前年增长率：5%</p>
                <p>AI 提效后年增长率：10%</p>
                <p>AI 提效后年增长率标准差倍数：2.8</p>
                <p>结论：AI 提效后年增长率接近工业革命级别，但仍在 2-3 倍真实提效区间内。</p>
              </div>
            </div>
          </div>
          <div class="status" id="status"></div>
        </div>
      </div>
    </main>

    <div class="foot">
      <strong>AI 提效分析工具</strong>：用数据量化 AI 提效潜力，助您做出更明智的业务决策。
    </div>
  </div>
  <script>
    window.DATA_SCHEMA = {
      name: "AI 提效分析",
      columns: [
        {key:"current_efficiency", label:"当前效率提升预期 (%)", type:"number", example:"20", required:true},
        {key:"ai_efficiency", label:"AI 预期提升 (%)", type:"number", example:"10", required:true},
        {key:"current_growth", label:"当前年增长率 (%)", type:"number", example:"5", required:true},
        {key:"ai_growth", label:"AI 提效后年增长率 (%)", type:"number", example:"10", required:true},
        {key:"scenario", label:"业务场景描述", type:"text", example:"短视频文案制作", required:true}
      ],
      sample: [
        {current_efficiency:20, ai_efficiency:10, current_growth:5, ai_growth:10, scenario:"短视频文案制作"},
        {current_efficiency:15, ai_efficiency:5, current_growth:3, ai_growth:8, scenario:"客服响应时间"},
        {current_efficiency:25, ai_efficiency:15, current_growth:7, ai_growth:12, scenario:"电商客服"}
      ],
      maxRows: 300
    };

    document.getElementById("generate").addEventListener("click", () => {
      const inputs = {
        current_efficiency: parseFloat(document.querySelector("input[name='current_efficiency']").value),
        ai_efficiency: parseFloat(document.querySelector("input[name='ai_efficiency']").value),
        current_growth: parseFloat(document.querySelector("input[name='current_growth']").value),
        ai_growth: parseFloat(document.querySelector("input[name='ai_growth']").value),
        scenario: document.querySelector("textarea[name='scenario']").value
      };
      fetch("/api/generate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({inputs: inputs})
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("results").innerHTML = `
          <div class="result-card">
            <h3>AI 提效分析结果</h3>
            <div class="rc-body">
              <p>当前效率提升预期：${inputs.current_efficiency}%</p>
              <p>AI 预期提升：${inputs.ai_efficiency}%</p>
              <p>当前年增长率：${inputs.current_growth}%</p>
              <p>AI 提效后年增长率：${inputs.ai_growth}%</p>
              <p>AI 提效后年增长率标准差倍数：${(inputs.ai_growth / inputs.current_growth).toFixed(2)}</p>
              <p>结论：AI 提效后年增长率接近工业革命级别，但仍在 2-3 倍真实提效区间内。</p>
            </div>
          </div>
        `;
        document.getElementById("status").innerText = "";
      })
      .catch(error => {
        console.error("Error:", error);
        document.getElementById("status").innerText = "生成失败，请重试。";
      });
    });

    document.getElementById("clear").addEventListener("click", () => {
      document.querySelector("input[name='current_efficiency']").value = "";
      document.querySelector("input[name='ai_efficiency']").value = "";
      document.querySelector("input[name='current_growth']").value = "";
      document.querySelector("input[name='ai_growth']").value = "";
      document.querySelector("textarea[name='scenario']").value = "";
      document.getElementById("results").innerHTML = `
        <div class="result-card">
          <h3>示例结果</h3>
          <div class="rc-body">
            <p>当前效率提升预期：20%</p>
            <p>AI 预期提升：10%</p>
            <p>当前年增长率：5%</p>
            <p>AI 提效后年增长率：10%</p>
            <p>AI 提效后年增长率标准差倍数：2.8</p>
            <p>结论：AI 提效后年增长率接近工业革命级别，但仍在 2-3 倍真实提效区间内。</p>
          </div>
        </div>
      `;
      document.getElementById("status").innerText = "";
    });
  </script>
</body>
</html>
