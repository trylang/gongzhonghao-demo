<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代州黄酒短视频脚本批量生成器</title>
    <style>
        :root {
            --main-color: #d6982f;
            --background-color: #fdfdfd;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --button-color: #ffffff;
            --button-bg: var(--main-color);
            --button-hover-bg: #c28b29;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --font-family: "Helvetica Neue", Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: var(--main-color);
        }
        .section {
            margin-bottom: 40px;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .button {
            padding: 10px 20px;
            background-color: var(--button-bg);
            color: var(--button-color);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: var(--button-hover-bg);
        }
        .preset-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .preset-button {
            flex: 1;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .preset-button.selected {
            background-color: var(--main-color);
            color: var(--button-color);
            border-color: var(--main-color);
        }
        .preset-button:hover {
            border-color: var(--main-color);
        }
        .data-entry {
            margin-bottom: 20px;
        }
        .data-entry textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            resize: vertical;
            font-size: 16px;
        }
        .results {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
        }
        .results h2 {
            margin-top: 0;
            color: var(--main-color);
        }
        .results .script {
            margin-bottom: 20px;
        }
        .results .script p {
            margin: 5px 0;
        }
        .results .script .duration {
            font-weight: bold;
        }
        .results .script .content {
            white-space: pre-wrap;
        }
        .results .storyboard {
            margin-bottom: 20px;
        }
        .results .storyboard .frame {
            margin-bottom: 10px;
        }
        .results .storyboard .frame .frame-number {
            font-weight: bold;
        }
        .results .storyboard .frame .description {
            margin-left: 10px;
        }
        .export-buttons {
            display: flex;
            gap: 10px;
        }
        .export-buttons button {
            flex: 1;
        }
        @media (max-width: 768px) {
            .preset-buttons {
                flex-direction: column;
            }
            .export-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>代州黄酒短视频脚本批量生成器</h1>
        <div id="data-intake"></div>
        <div class="section">
            <div class="buttons">
                <button class="button" id="generate-button">生成脚本</button>
                <button class="button" id="clear-button">清空 / 重填</button>
                <button class="button" id="copy-button">复制结果</button>
                <button class="button" id="export-button">导出 JSON</button>
                <button class="button" id="random-button">随机示例</button>
            </div>
            <div class="preset-buttons">
                <button class="preset-button" data-preset="A">场景A: 节日促销</button>
                <button class="preset-button" data-preset="B">场景B: 产品介绍</button>
                <button class="preset-button" data-preset="C">场景C: 用户故事</button>
            </div>
            <div class="data-entry">
                <textarea id="data-input" placeholder="请输入您的产品卖点或选择场景预设..."></textarea>
            </div>
        </div>
        <div class="section">
            <div class="results" id="results-panel" style="display: none;">
                <h2>生成结果</h2>
                <div class="script">
                    <p class="duration">30秒口播脚本</p>
                    <div class="content" id="script-30s">示例结果加载中...</div>
                </div>
                <div class="script">
                    <p class="duration">60秒口播脚本</p>
                    <div class="content" id="script-60s">示例结果加载中...</div>
                </div>
                <div class="storyboard">
                    <p>分镜脚本</p>
                    <div class="frame" id="storyboard-frame1">示例结果加载中...</div>
                    <div class="frame" id="storyboard-frame2">示例结果加载中...</div>
                    <div class="frame" id="storyboard-frame3">示例结果加载中...</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // 数据入口组件声明
        window.DATA_SCHEMA = {
            name: "产品卖点",
            columns: [
                {key: "product_name", label: "产品名称", type: "text", example: "代州黄酒", required: true},
                {key: "卖点", label: "产品卖点", type: "text", example: "传统工艺酿造", required: true},
                {key: "target_audience", label: "目标受众", type: "text", example: "中年男性", required: true},
                {key: "场景", label: "使用场景", type: "text", example: "家庭聚餐", required: true}
            ],
            sample: [
                {product_name: "代州黄酒", 卖点: "传统工艺酿造", target_audience: "中年男性", 场景: "家庭聚餐"},
                {product_name: "代州黄酒", 卖点: "低度健康", target_audience: "女性消费者", 场景: "朋友聚会"},
                {product_name: "代州黄酒", 卖点: "历史悠久", target_audience: "文化爱好者", 场景: "文化活动"},
                {product_name: "代州黄酒", 卖点: "口感醇厚", target_audience: "酒类爱好者", 场景: "商务宴请"},
                {product_name: "代州黄酒", 卖点: "包装精美", target_audience: "礼品市场", 场景: "节日送礼"},
                {product_name: "代州黄酒", 卖点: "价格实惠", target_audience: "大众消费者", 场景: "日常饮用"},
                {product_name: "代州黄酒", 卖点: "产地直供", target_audience: "电商用户", 场景: "线上购物"},
                {product_name: "代州黄酒", 卖点: "环保包装", target_audience: "环保主义者", 场景: "环保活动"}
            ],
            maxRows: 300
        };

        const SEED = {
            "卖点": "传统工艺酿造",
            "产品名称": "代州黄酒",
            "target_audience": "中年男性",
            "场景": "家庭聚餐",
            "script_30s": "欢迎品尝代州黄酒，传承百年工艺，酿造经典好味道。代州黄酒采用传统工艺酿造，口感醇厚，回味悠长，是您家庭聚餐的最佳选择。快来选购吧！",
            "script_60s": "代州黄酒，传承百年工艺，酿造经典好味道。我们的黄酒采用传统工艺酿造，精选优质原料，经过多道工序精心酿制而成。代州黄酒口感醇厚，回味悠长，是您家庭聚餐的最佳选择。无论是与家人共享，还是招待亲朋好友，代州黄酒都能为您增添一份温馨与欢乐。快来选购吧！",
            "storyboard": [
                { "frame_number": "1", "description": "镜头展示代州黄酒产品，背景是温馨的家庭聚餐场景。" },
                { "frame_number": "2", "description": "镜头特写，展示黄酒的色泽和质感。" },
                { "frame_number": "3", "description": "镜头切换到人们举杯庆祝，欢声笑语中享用代州黄酒。" }
            ]
        };

        let currentData = {};

        // 填充示例数据
        function populateSeed(seed) {
            document.getElementById("data-input").value = JSON.stringify(seed, null, 2);
            currentData = seed;
        }

        // 清空数据
        function clearData() {
            document.getElementById("data-input").value = "";
            currentData = {};
            hideResults();
        }

        // 显示结果
        function showResults(data) {
            document.getElementById("script-30s").innerText = data.script_30s;
            document.getElementById("script-60s").innerText = data.script_60s;
            const storyboard = data.storyboard;
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`storyboard-frame${i}`).innerText = storyboard[i - 1].description;
            }
            document.getElementById("results-panel").style.display = "block";
        }

        // 隐藏结果
        function hideResults() {
            document.getElementById("results-panel").style.display = "none";
        }

        // 复制结果
        function copyResults() {
            const data = {
                "30秒口播脚本": document.getElementById("script-30s").innerText,
                "60秒口播脚本": document.getElementById("script-60s").innerText,
                "分镜脚本": document.getElementById("storyboard-frame1").innerText + "\n" +
                             document.getElementById("storyboard-frame2").innerText + "\n" +
                             document.getElementById("storyboard-frame3").innerText
            };
            const jsonString = JSON.stringify(data, null, 2);
            navigator.clipboard.writeText(jsonString).then(() => {
                alert("结果已复制到剪贴板");
            }).catch(() => {
                alert("复制失败");
            });
        }

        // 导出 JSON
        function exportJson() {
            const data = {
                "30秒口播脚本": document.getElementById("script-30s").innerText,
                "60秒口播脚本": document.getElementById("script-60s").innerText,
                "分镜脚本": [
                    { "frame_number": "1", "description": document.getElementById("storyboard-frame1").innerText },
                    { "frame_number": "2", "description": document.getElementById("storyboard-frame2").innerText },
                    { "frame_number": "3", "description": document.getElementById("storyboard-frame3").innerText }
                ]
            };
            const jsonString = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "脚本结果.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        // 随机示例
        function getRandomSeed() {
            const seeds = [
                SEED,
                {
                    "卖点": "低度健康",
                    "产品名称": "代州黄酒",
                    "target_audience": "女性消费者",
                    "场景": "朋友聚会",
                    "script_30s": "代州黄酒，低度健康，适合女性朋友聚会时饮用。代州黄酒口感清爽，不易醉，是您聚会时的理想选择。快来选购吧！",
                    "script_60s": "代州黄酒，低度健康，适合女性朋友聚会时饮用。我们的黄酒采用传统工艺酿造，口感清爽，不易醉，是您聚会时的理想选择。无论是与朋友共享，还是享受轻松时光，代州黄酒都能为您增添一份愉悦。快来选购吧！",
                    "storyboard": [
                        { "frame_number": "1", "description": "镜头展示代州黄酒产品，背景是热闹的朋友聚会场景。" },
                        { "frame_number": "2", "description": "镜头特写，展示黄酒的色泽和质感。" },
                        { "frame_number": "3", "description": "镜头切换到人们举杯庆祝，欢声笑语中享用代州黄酒。" }
                    ]
                },
                {
                    "卖点": "历史悠久",
                    "产品名称": "代州黄酒",
                    "target_audience": "文化爱好者",
                    "场景": "文化活动",
                    "script_30s": "代州黄酒，历史悠久，传承百年文化。代州黄酒不仅是美酒，更是文化的象征。快来体验代州黄酒的文化魅力吧！",
                    "script_60s": "代州黄酒，历史悠久，传承百年文化。我们的黄酒承载着丰富的历史文化底蕴，是您体验传统文化的绝佳选择。无论是参加文化活动，还是在家中品味，代州黄酒都能为您带来一份独特的文化体验。快来选购吧！",
                    "storyboard": [
                        { "frame_number": "1", "description": "镜头展示代州黄酒产品，背景是文化活动的场景。" },
                        { "frame_number": "2", "description": "镜头展示代州黄酒的历史文化元素。" },
                        { "frame_number": "3", "description": "镜头切换到人们欣赏黄酒，品味文化。" }
                    ]
                }
            ];
            return seeds[Math.floor(Math.random() * seeds.length)];
        }

        // 场景预设按钮事件
        document.querySelectorAll(".preset-button").forEach(button => {
            button.addEventListener("click", () => {
                const preset = button.getAttribute("data-preset");
                if (preset === "A") {
                    populateSeed(SEED);
                } else if (preset === "B") {
                    populateSeed({
                        "卖点": "低度健康",
                        "产品名称": "代州黄酒",
                        "target_audience": "女性消费者",
                        "场景": "朋友聚会",
                        "script_30s": "代州黄酒，低度健康，适合女性朋友聚会时饮用。代州黄酒口感清爽，不易醉，是您聚会时的理想选择。快来选购吧！",
                        "script_60s": "代州黄酒，低度健康，适合女性朋友聚会时饮用。我们的黄酒采用传统工艺酿造，口感清爽，不易醉，是您聚会时的理想选择。无论是与朋友聊天，还是享受轻松时光，代州黄酒都能为您增添一份愉悦。快来选购吧！",
                        "storyboard": [
                            { "frame_number": "1", "description": "镜头展示代州黄酒产品，背景是热闹的朋友聚会场景。" },
                            { "frame_number": "2", "description": "镜头特写，展示黄酒的色泽和质感。" },
                            { "frame_number": "3", "description": "镜头切换到人们举杯庆祝，欢声笑语中享用代州黄酒。" }
                        ]
                    });
                } else if (preset === "C") {
                    populateSeed({
                        "卖点": "历史悠久",
                        "产品名称": "代州黄酒",
                        "target_audience": "文化爱好者",
                        "场景": "文化活动",
                        "script_30s": "代州黄酒，历史悠久，传承百年文化。代州黄酒不仅是美酒，更是文化的象征。快来体验代州黄酒的文化魅力吧！",
                        "script_60s": "代州黄酒，历史悠久，传承百年文化。我们的黄酒承载着丰富的历史文化底蕴，是您体验传统文化的绝佳选择。无论是参加文化活动，还是在家中品味，代州黄酒都能为您带来一份独特的文化体验。",
                        "storyboard": [
                            { "frame_number": "1", "description": "镜头展示代州黄酒产品，背景是文化活动的场景。" },
                            { "frame_number": "2", "description": "镜头展示代州黄酒的历史文化元素。" },
                            { "frame_number": "3", "description": "镜头切换到人们欣赏黄酒，品味文化。" }
                        ]
                    });
                }
                document.getElementById("data-input").value = JSON.stringify(currentData, null, 2);
            });
        });

        // 生成按钮事件
        document.getElementById("generate-button").addEventListener("click", () => {
            const dataInput = document.getElementById("data-input").value;
            let inputs = {};
            if (window.DataIntake && window.DataIntake.isReady()) {
                inputs.data = window.DataIntake.getPayload();
            } else {
                inputs = currentData;
            }
            fetch("/api/generate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ "inputs": inputs })
            }).then(response => response.json()).then(data => {
                showResults(data);
            }).catch(() => {
                alert("生成失败，请重试");
            });
        });

        // 清空按钮事件
        document.getElementById("clear-button").addEventListener("click", clearData);

        // 复制按钮事件
        document.getElementById("copy-button").addEventListener("click", copyResults);

        // 导出按钮事件
        document.getElementById("export-button").addEventListener("click", exportJson);

        // 随机按钮事件
        document.getElementById("random-button").addEventListener("click", () => {
            const seed = getRandomSeed();
            populateSeed(seed);
        });

        // 初始化
        populateSeed(SEED);
    </script>
</body>
</html>
