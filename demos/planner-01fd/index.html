<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 电商效率分析工具</title>
    <style>
        :root {
            --main-color: #2c3e50;
            --background-color: #f5f5f5;
            --text-color: #34495e;
            --accent-color: #e74c3c;
            --border-radius: 8px;
            --box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background-color: #fff;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        h1 {
            text-align: center;
            color: var(--main-color);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .button {
            background-color: var(--main-color);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: var(--accent-color);
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: var(--border-radius);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            background-color: #fafafa;
        }
        .result h2 {
            margin-top: 0;
            color: var(--accent-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: var(--main-color);
            color: #fff;
        }
        .example-result {
            position: relative;
            padding: 20px;
            background-color: #eef2f5;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }
        .example-result::before {
            content: "示例结果";
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--accent-color);
            color: #fff;
            padding: 5px 10px;
            border-bottom-left-radius: var(--border-radius);
            font-size: 0.8em;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="data-intake"></div>
    <div class="container">
        <h1>AI 电商效率分析工具</h1>
        <div class="controls">
            <button class="button" id="generate-btn">生成分析</button>
            <button class="button" id="clear-btn">清空/重填</button>
            <button class="button" id="copy-btn">复制结果</button>
            <button class="button" id="export-btn">导出 JSON</button>
            <button class="button" id="random-btn">随机示例</button>
            <button class="button" id="preset-a-btn">场景A</button>
            <button class="button" id="preset-b-btn">场景B</button>
            <button class="button" id="preset-c-btn">场景C</button>
        </div>
        <div class="input-group">
            <label for="order-no">订单号</label>
            <input type="text" id="order-no" placeholder="SO...">
        </div>
        <div class="input-group">
            <label for="customer-name">客户姓名</label>
            <input type="text" id="customer-name" placeholder="张三">
        </div>
        <div class="input-group">
            <label for="purchase-amount">购买金额</label>
            <input type="number" id="purchase-amount" placeholder="1000">
        </div>
        <div class="input-group">
            <label for="purchase-date">购买日期</label>
            <input type="date" id="purchase-date">
        </div>
        <div class="input-group">
            <label for="product-category">产品类别</label>
            <select id="product-category">
                <option value="electronics">电子产品</option>
                <option value="clothing">服装</option>
                <option value="food">食品</option>
                <option value="other">其他</option>
            </select>
        </div>
        <div class="result hidden" id="result">
            <h2>分析结果</h2>
            <div id="analysis-output"></div>
        </div>
    </div>
    <script>
        const SEED = [
            {
                order_no: "SO123456",
                customer_name: "李四",
                purchase_amount: 1500,
                purchase_date: "2023-09-15",
                product_category: "电子产品"
            },
            {
                order_no: "SO234567",
                customer_name: "王五",
                purchase_amount: 2000,
                purchase_date: "2023-09-16",
                product_category: "服装"
            },
            {
                order_no: "SO345678",
                customer_name: "赵六",
                purchase_amount: 800,
                purchase_date: "2023-09-17",
                product_category: "食品"
            },
            // 添加更多示例数据
        ];

        const PRESETS = {
            "场景A": [
                {
                    order_no: "SO100001",
                    customer_name: "张三",
                    purchase_amount: 1200,
                    purchase_date: "2023-08-10",
                    product_category: "电子产品"
                },
                // 添加更多场景A数据
            ],
            "场景B": [
                {
                    order_no: "SO200002",
                    customer_name: "李四",
                    purchase_amount: 1800,
                    purchase_date: "2023-08-11",
                    product_category: "服装"
                },
                // 添加更多场景B数据
            ],
            "场景C": [
                {
                    order_no: "SO300003",
                    customer_name: "王五",
                    purchase_amount: 2200,
                    purchase_date: "2023-08-12",
                    product_category: "食品"
                },
                // 添加更多场景C数据
            ]
        };

        let currentData = SEED;

        document.getElementById("generate-btn").addEventListener("click", () => {
            const data = {
                order_no: document.getElementById("order-no").value,
                customer_name: document.getElementById("customer-name").value,
                purchase_amount: parseFloat(document.getElementById("purchase-amount").value),
                purchase_date: document.getElementById("purchase-date").value,
                product_category: document.getElementById("product-category").value
            };
            const inputs = {
                data: currentData
            };
            fetch("/api/generate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ inputs: inputs })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("analysis-output").innerHTML = JSON.stringify(data, null, 2);
                document.getElementById("result").classList.remove("hidden");
            })
            .catch(error => {
                console.error("Error:", error);
            });
        });

        document.getElementById("clear-btn").addEventListener("click", () => {
            document.getElementById("order-no").value = "";
            document.getElementById("customer-name").value = "";
            document.getElementById("purchase-amount").value = "";
            document.getElementById("purchase-date").value = "";
            document.getElementById("product-category").value = "electronics";
            document.getElementById("result").classList.add("hidden");
        });

        document.getElementById("copy-btn").addEventListener("click", () => {
            const result = document.getElementById("analysis-output").innerText;
            navigator.clipboard.writeText(result)
            .then(() => {
                alert("结果已复制到剪贴板");
            })
            .catch(err => {
                console.error("复制失败:", err);
            });
        });

        document.getElementById("export-btn").addEventListener("click", () => {
            const result = document.getElementById("analysis-output").innerText;
            const blob = new Blob([result], { type: "application/json" });
            const url  = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "analysis_result.json";
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById("random-btn").addEventListener("click", () => {
            const randomIndex = Math.floor(Math.random() * SEED.length);
            currentData = [SEED[randomIndex]];
            document.getElementById("order-no").value = SEED[randomIndex].order_no;
            document.getElementById("customer-name").value = SEED[randomIndex].customer_name;
            document.getElementById("purchase-amount").value = SEED[randomIndex].purchase_amount;
            document.getElementById("purchase-date").value = SEED[random_index].purchase_date;
            document.getElementById("product-category").value = SEED[randomIndex].product_category;
            document.getElementById("result").classList.add("hidden");
        });

        document.getElementById("preset-a-btn").addEventListener("click", () => {
            currentData = PRESETS["场景A"];
            populateFields(PRESETS["场景A"][0]);
            document.getElementById("result").classList.add("hidden");
        });

        document.getElementById("preset-b-btn").addEventListener("click", () => {
            currentData = PRESETS["场景B"];
            populateFields(PRESETS["场景B"][0]);
            document.getElementById("result").classList.add("hidden");
        });

        document.getElementById("preset-c-btn").addEventListener("click", () => {
            currentData = PRESETS["场景C"];
            populateFields(PRESETS["场景C"][0]);
            document.getElementById("result").classList.add("hidden");
        });

        function populateFields(data) {
            document.getElementById("order-no").value = data.order_no;
            document.getElementById("customer-name").value = data.customer_name;
            document.getElementById("purchase-amount").value = data.purchase_amount;
            document.getElementById("purchase-date").value = data.purchase_date;
            document.getElementById("product-category").value = data.product_category;
        }

        window.DATA_SCHEMA = {
            name: "订单明细",
            columns: [
                { key: "order_no", label: "订单号", type: "text", example: "SO...", required: true },
                { key: "customer_name", label: "客户姓名", type: "text", example: "张三", required: true },
                { key: "purchase_amount", label: "购买金额", type: "number", example: "1000", required: true },
                { key: "purchase_date", label: "购买日期", type: "date", example: "2023-09-15", required: true },
                { key: "product_category", label: "产品类别", type: "select", options: ["电子产品", "服装", "食品", "其他"], required: true }
            ],
            sample: [
                {
                    order_no: "SO100001",
                    customer_name: "张三",
                    purchase_amount: 1200,
                    purchase_date: "2023-08-10",
                    product_category: "电子产品"
                },
                // 添加更多示例数据
            ],
            maxRows: 300
        };
    </script>
</body>
</html>
