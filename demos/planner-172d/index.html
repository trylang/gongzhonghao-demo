<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>电商运营效率提升工具 - AI 轻量看板生成器</title>
  <style>
:root{
  --bg:#f6f3ee; --card:#fffdfa; --ink:#3a352f; --ink-soft:#756c64; --muted:#8a7f76;
  --accent:#a65d4c; --accent-deep:#6d453a; --accent-soft:#f3e7e1;
  --line:#e6ded3; --line-strong:#d8cdbc;
  --ok:#4a7c59; --warn:#b42318; --info:#4f8cff;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(109,69,58,.08);
  --maxw:1080px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Songti SC",serif;
  line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* hero 顶部价值主张（禁止只放一个孤零零的 h1） */
.hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fbf4ee;padding:46px 0 38px;text-align:center}
.hero .kicker{letter-spacing:2px;font-size:12.5px;opacity:.85;margin:0 0 10px}
.hero h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 12px;font-weight:600}
.hero .sub{max-width:720px;margin:0 auto;opacity:.92;font-size:14.5px}
.hero .sub strong{color:#ffe2d3}

/* 区块 / 卡片 */
main{padding:30px 0 56px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px}
.card h2,.panel h2{margin:0 0 4px;font-size:17px;color:var(--accent-deep)}
.card .hint,.panel .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}

/* 双栏布局：左输入卡 / 右结果卡 */
.layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

/* 表单（最小必要字段，优先 select/预设） */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field>span,.field>label{font-size:13px;color:var(--ink-soft)}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 按钮（唯一主按钮 + 少量次要 + 胶囊示例） */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary.big{padding:13px 24px;font-size:15.5px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 胶囊 / 选项卡 / 标签（标杆通用交互件） */
.pill,.tab,.chip{border:1px solid var(--line);background:#fff;color:var(--accent-deep);padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.pill:hover,.tab:hover,.chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab.active,.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep)}
.tag.ok{background:rgba(74,124,89,.16);color:var(--ok)}
.tag.warn{background:rgba(180,35,24,.14);color:var(--warn)}
.tag.muted{background:#eee3d6;color:var(--muted)}

/* 结果可视化（禁止死表格/纯文本） */
.results{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
.result-card h3,.result-card h4{margin:0 0 8px;color:var(--accent-deep)}
.result-card .rc-body{white-space:pre-wrap;font-size:14.5px;line-height:1.75}
.rc-body .stats{display:flex;flex-wrap:wrap;gap:10px}
.rc-body .stat-box{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:center;flex:1}
.rc-body .stat-box .big{font-size:16px;font-weight:600;color:var(--accent-deep)}
.rc-body .stat-box label{font-size:12px;color:var(--muted)}

/* 底部理念 */
.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:22px}
.foot strong{color:var(--accent-deep)}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="data-intake"></div>
  <div class="wrap">
    <div class="hero">
      <div class="kicker">AI 效率工具</div>
      <h1>电商轻量看板生成器</h1>
      <div class="sub">
        用 AI 提升电商运营效率，实时分析订单数据，生成可视化看板，<strong>每天只需 5 分钟</strong>，让您的决策更精准。
      </div>
    </div>
    <main>
      <div class="layout">
        <div class="card">
          <h2>输入数据</h2>
          <div class="form-grid">
            <div class="field">
              <label for="platform">电商平台</label>
              <select id="platform" name="platform">
                <option value="wechat">微信订单</option>
                <option value="douyin">抖音小店</option>
                <option value="kuaidi100">快递100</option>
              </select>
            </div>
            <div class="field">
              <label for="date-range">日期范围</label>
              <input type="date" id="date-range" name="date-range" placeholder="选择日期范围">
            </div>
            <div class="field wide">
              <label for="data-upload">上传数据文件</label>
              <input type="file" id="data-upload" name="data-upload" accept=".csv,.xlsx">
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" id="generate-btn">生成看板</button>
            <button class="btn ghost" id="clear-btn">清空</button>
          </div>
          <div class="pill-list">
            <button class="pill" data-seed="scenario1">场景一：微信订单</button>
            <button class="pill" data-seed="scenario2">场景二：抖音小店</button>
            <button class="pill" data-seed="scenario3">场景三：快递100</button>
          </div>
        </div>
        <div class="card">
          <h2>看板结果</h2>
          <div class="results" id="results">
            <div class="result-card">
              <h3>示例结果</h3>
              <div class="rc-body">
                <p>每日发货量：<strong>120</strong></p>
                <p>复购率：<strong>15%</strong></p>
                <p>客单价：<strong>¥250</strong></p>
              </div>
            </div>
          </div>
          <div class="status" id="status"></div>
        </div>
      </div>
    </main>
    <div class="foot">
      <strong>AI 不做结论性动作，最后一步由您掌控。</strong> 专注效率提升，而非颠覆。
    </div>
  </div>
  <script>
const SEED = {
  scenario1: {
    platform: "wechat",
    date_range: "2023-10-01",
    data_upload: null,
    data: [
      { order_no: "WX1001", date: "2023-10-01", amount: 250, customer_id: "C001" },
      { order_no: "WX1002", date: "2023-10-02", amount: 300, customer_id: "C002" },
      // ... more data ...
    ]
  },
  scenario2: {
    platform: "douyin",
    date_range: "2023-10-01",
    data_upload: null,
    data: [
      { order_no: "DY2001", date: "2023-10-01", amount: 200, customer_id: "C003" },
      { order_no: "DY2002", date: "2023-10-03", amount: 350, customer_id: "C004" },
      // ... more data ...
    ]
  },
  scenario3: {
    platform: "kuaidi100",
    date_range: "2023-10-01",
    data_upload: null,
    data: [
      { order_no: "KD3001", date: "2023-10-01", amount: 150, customer_id: "C005" },
      { order_no: "KD3002", date: "2023-10-04", amount: 400, customer_id: "C006" },
      // ... more data ...
    ]
  }
};

window.DATA_SCHEMA = {
  name: "订单明细",
  columns: [
    { key: "order_no", label: "订单号", type: "text", example: "SO...", required: true },
    { key: "date", label: "日期", type: "date", example: "2023-10-01", required: true },
    { key: "amount", label: "金额", type: "number", example: "250", required: true },
    { key: "customer_id", label: "客户ID", type: "text", example: "C001", required: false }
  ],
  sample: [
    { order_no: "WX1001", date: "2023-10-01", amount: 250, customer_id: "C001" },
    { order_no: "WX1002", date: "2023-10-02", amount: 300, customer_id: "C002" },
    // ... more sample data ...
  ],
  maxRows: 300
};

document.getElementById("generate-btn").addEventListener("click", () => {
  const platform = document.getElementById("platform").value;
  const dateRange = document.getElementById("date-range").value;
  const dataUpload = document.getElementById("data-upload").files[0];
  const data = window.DataIntake && window.DataIntake.isReady() ? window.DataIntake.getPayload() : SEED[platform].data;

  const inputs = {
    platform,
    date_range: dateRange,
    data_upload: dataUpload ? "uploaded" : null,
    data: data
  };

  fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ inputs })
  })
    .then(response => response.json())
    .then(data => {
      document.getElementById("results").innerHTML = `
        <div class="result-card">
          <h3>看板结果</h3>
          <div class="rc-body">
            <div class="stats">
              <div class="stat-box">
                <div class="big">${data.daily_shipments}</div>
                <label>每日发货量</label>
              </div>
              <div class="stat-box">
                <div class="big">${data.repeat_rate}%</div>
                <label>复购率</label>
              </div>
              <div class="stat-box">
                <div class="big">¥${data.average_order_value}</div>
                <label>客单价</label>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById("status").innerText = "生成成功";
    })
    .catch(error => {
      console.error("Error:", error);
      document.getElementById("status").innerText = "生成失败，请重试";
    });
});

document.getElementById("clear-btn").addEventListener("click", () => {
  document.getElementById("platform").value = "wechat";
  document.getElementById("date-range").value = "";
  document.getElementById("data-upload").value = "";
  document.getElementById("results").innerHTML = `
    <div class="result-card">
      <h3>示例结果</h3>
      <div class="rc-body">
        <p>每日发货量：<strong>120</strong></p>
        <p>复购率：<strong>15%</strong></p>
        <p>客单价：<strong>¥250</strong></p>
      </div>
    </div>
  `;
  document.getElementById("status").innerText = "";
});

document.querySelectorAll(".pill").forEach(pill => {
  pill.addEventListener("click", () => {
    const scenario = pill.getAttribute("data-seed");
    const seedData = SEED[scenario].data;
    window.DataIntake.setPayload(seedData);
    document.getElementById("platform").value = SEED[scenario].platform;
    document.getElementById("date-range").value = SEED[scenario].date_range;
    document.getElementById("data-upload").value = "";
    document.getElementById("results").innerHTML = `
      <div class="result-card">
        <h3>示例结果</h3>
        <div class="rc-body">
          <p>每日发货量：<strong>${SEED[scenario].data.length}</strong></p>
          <p>复购率：<strong>${Math.floor(Math.random() * 20)}%</strong></p>
          <p>客单价：<strong>¥${Math.floor(Math.random() * 500)}</strong></p>
        </div>
      </div>
    `;
    document.getElementById("status").innerText = "";
  });
});
  </script>
</body>
</html>
