<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM 路由器 vs 单模型 + 缓存 对比 Demo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; background-color: #f5f5f5; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 30px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: 500; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        textarea { resize: vertical; height: 100px; }
        button { padding: 12px; background-color: #4a90e2; color: #fff; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #357abD; }
        .loading, .error { margin-top: 20px; font-size: 16px; }
        .loading { color: #888; }
        .error { color: #d9534f; }
        .result { margin-top: 30px; padding: 15px; background-color: #eef4f8; border-radius: 4px; white-space: pre-wrap; }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            button { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LLM 路由器 vs 单模型 + 缓存 对比 Demo</h1>
        <form id="generate-form">
            <div class="form-group">
                <label for="task">任务描述</label>
                <textarea id="task" name="task" placeholder="请输入您需要生成的任务描述，例如：'请帮我写一篇关于AI应用的文章'" required></textarea>
            </div>
            <div class="form-group">
                <label for="model-type">模型类型</label>
                <select id="model-type" name="modelType" required>
                    <option value="router">LLM 路由器</option>
                    <option value="single">单模型 + 缓存</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cache-enabled">启用缓存</label>
                <select id="cache-enabled" name="cacheEnabled">
                    <option value="true">是</option>
                    <option value="false">否</option>
                </select>
            </div>
            <button type="submit">生成 / 运行</button>
        </form>
        <div id="output" class="result"></div>
        <div id="loading" class="loading" style="display: none;">生成中，请稍候...</div>
        <div id="error" class="error" style="display: none;">发生错误，请稍后再试。</div>
    </div>

    <script>
        document.getElementById('generate-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const task = document.getElementById('task').value.trim();
            const modelType = document.getElementById('model-type').value;
            const cacheEnabled = document.getElementById('cache-enabled').value === 'true';
            const outputDiv = document.getElementById('output');
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');

            // 清除之前的状态
            outputDiv.textContent = '';
            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task, modelType, cacheEnabled })
                });

                if (!response.ok) {
                    throw new Error('网络响应不正常');
                }

                const data = await response.json();
                outputDiv.textContent = data.result;
            } catch (err) {
                console.error(err);
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html
