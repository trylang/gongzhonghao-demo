<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>代州黄酒短视频脚本批量生成器</title>
<style>
/* 【设计系统】粘贴基准设计系统CSS */
:root{
  --bg:#f6f3ee; --card:#fffdfa; --ink:#3a352f; --ink-soft:#756c64; --muted:#8a7f76;
  --accent:#a65d4c; --accent-deep:#6d453a; --accent-soft:#f3e7e1;
  --line:#e6ded3; --line-strong:#d8cdbc;
  --ok:#4a7c59; --warn:#b42318; --info:#4f8cff;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(109,69,58,.08);
  --maxw:1080px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Songti SC",serif;
  line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* hero 顶部价值主张 */
.hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fbf4ee;padding:46px 0 38px;text-align:center}
.hero .kicker{letter-spacing:2px;font-size:12.5px;opacity:.85;margin:0 0 10px}
.hero h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 12px;font-weight:600}
.hero .sub{max-width:720px;margin:0 auto;opacity:.92;font-size:14.5px}
.hero .sub strong{color:#ffe2d3}

/* 区块 / 卡片 */
main{padding:30px 0 56px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px}
.card h2,.panel h2{margin:0 0 4px;font-size:17px;color:var(--accent-deep)}
.card .hint,.panel .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}

/* 双栏布局：左输入卡 / 右结果卡 */
.layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

/* 表单（最小必要字段，优先 select/预设） */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field>span,.field>label{font-size:13px;color:var(--ink-soft)}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 按钮（唯一主按钮 + 少量次要 + 胶囊示例） */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary.big{padding:13px 24px;font-size:15.5px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 胶囊 / 选项卡 / 标签（标杆通用交互件） */
.pill,.tab,.chip{border:1px solid var(--line);background:#fff;color:var(--accent-deep);padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.pill:hover,.tab:hover,.chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab.active,.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep)}
.tag.ok{background:rgba(74,124,89,.16);color:var(--ok)}
.tag.warn{background:rgba(180,35,24,.14);color:var(--warn)}
.tag.muted{background:#eee3d6;color:var(--muted)}

/* 结果可视化（禁止死表格/纯文本） */
.results{display:grid;gap:16px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
.result-card h3,.result-card h4{margin:0 0 8px;color:var(--accent-deep)}
.result-card .rc-body{white-space:pre-wrap;font-size:14.5px;line-height:1.75}

/* 底部理念 */
.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:22px}
.foot strong{color:var(--accent-deep)}
</style>
</head>
<body>
<div id="data-intake"></div>

<div class="wrap">
  <!-- Hero -->
  <div class="hero">
    <div class="kicker">AI 工具赋能</div>
    <h1>代州黄酒短视频脚本生成器</h1>
    <div class="sub">
      传统酒企营销利器，输入一个卖点，自动生成30秒/60秒口播脚本和分镜。告别外包高成本，实现内容批量生产。
    </div>
  </div>

  <!-- Main content -->
  <main>
    <div class="layout">
      <!-- Input card -->
      <div class="card">
        <h2>输入卖点信息</h2>
        <div class="form-grid">
          <div class="field">
            <label>卖点主题</label>
            <input type="text" id="topic" placeholder="例如：黄酒的历史">
          </div>
          <div class="field">
            <label>目标时长</label>
            <select id="duration">
              <option value="30">30秒</option>
              <option value="60">60秒</option>
            </select>
          </div>
          <div class="field wide">
            <label>核心卖点</label>
            <textarea id="selling_point" placeholder="例如：代州黄酒采用传统工艺酿造"></textarea>
          </div>
          <div class="field">
            <label>场景预设</label>
            <div class="actions">
              <button class="pill" onclick="preset('场景A')">场景A</button>
              <button class="pill" onclick="preset('场景B')">场景B</button>
              <button class="pill" onclick="preset('场景C')">场景C</button>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" onclick="generate()">生成脚本</button>
          <button class="btn ghost" onclick="clearForm()">清空</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <!-- Result card -->
      <div class="card">
        <h2>生成结果</h2>
        <div class="results" id="results">
          <div class="result-card">
            <h3>30秒口播脚本</h3>
            <div class="rc-body" id="script_30">点击生成按钮查看结果</div>
          </div>
          <div class="result-card">
            <h3>60秒口播脚本</h3>
            <div class="rc-body" id="script_60">点击生成按钮查看结果</div>
          </div>
          <div class="result-card">
            <h3>分镜脚本</h3>
            <div class="rc-body" id="storyboard">点击生成按钮查看结果</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div class="foot">
    AI 不给结论性动作，最后那一下由你点。<strong>代州黄酒营销升级，从这里开始。</strong>
  </div>
</div>

<script>
const SEED = {
  topic: "黄酒的历史",
  duration: "30",
  selling_point: "代州黄酒采用传统工艺酿造，口感醇厚，回味悠长。",
  scene: "场景A"
};

let currentData = {...SEED};

// 场景预设函数
function preset(scene) {
    if(scene === "场景A"){
        currentData.topic = "黄酒的历史";
        currentData.selling_point = "代州黄酒采用传统工艺酿造，口感醇厚，回味悠长。";
    }
    if(scene === "场景B"){
        currentData.topic = "黄酒的营养价值";
        currentData.selling_point = "代州黄酒富含多种氨基酸和微量元素，是健康饮酒的最佳选择。";
    }
    if(scene === "场景C"){
        currentData.topic = "黄酒的酿造工艺";
        currentData.selling_point = "代州黄酒坚持手工酿造，传承百年工艺。";
    }
    document.getElementById("topic").value = currentData.topic;
    document.getElementById("duration").value = currentData.duration;
    document.getElementById("selling_point").value = currentData.selling_point;
    document.querySelectorAll(".pill").forEach(p => p.classList.remove("on"));
    document.querySelector(`button[onclick="preset('${scene}')"]`).classList.add("on");
}

// 表单清空函数
function clearForm(){
    currentData = {...SEED};
    document.getElementById("topic").value = currentData.topic;
    document.getElementById("duration").value = currentData.duration;
    document.getElementById("selling_point").value = currentData.selling_point;
    document.querySelectorAll(".pill").forEach(p => p.classList.remove("on"));
    document.querySelector(`button[onclick="preset('场景A')"]`).classList.add("on");
    document.getElementById("results").innerHTML = `
      <div class="result-card">
        <h3>30秒口播脚本</h3>
        <div class="rc-body">点击生成按钮查看结果</div>
      </div>
      <div class="result-card">
        <h3>60秒口播脚本</h3>
        <div class="rc-body">点击生成按钮查看结果</div>
      </div>
      <div class="result-card">
        <h3>分镜脚本</h3>
        <div class="rc-body">点击生成按钮查看结果</div>
      </div>
    `;
    document.getElementById("status").innerText = "";
}

// 生成函数
function generate(){
    document.getElementById("status").innerText = "生成中...";
    document.getElementById("status").classList.remove("error");
    document.getElementById("results").innerHTML = `<div class="result-card"><div class="spinner"></div> 生成中...</div>`;

    const inputs = {
        topic: document.getElementById("topic").value,
        duration: document.getElementById("duration").value,
        selling_point: document.getElementById("selling_point").value,
        scene: currentData.scene
    };

    fetch("/api/generate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({inputs: inputs})
    }).then(response => response.json())
      .then(data => {
          if(data.error){
              document.getElementById("status").innerText = "生成失败";
              document.getElementById("status").classList.add("error");
              document.getElementById("results").innerHTML = `<div class="result-card"><h3>错误</h3><div class="rc-body">${data.error}</div></div>`;
          } else {
              document.getElementById("status").innerText = "";
              document.getElementById("results").innerHTML = `
                <div class="result-card">
                  <h3>30秒口播脚本</h3>
                  <div class="rc-body">${data.script_30}</div>
                </div>
                <div class="result-card">
                  <h3>60秒口播脚本</h3>
                  <div class="rc-body">${data.script_60}</div>
                </div>
                <div class="result-card">
                  <h3>分镜脚本</h3>
                  <div class="rc-body">${data.storyboard}</div>
                </div>
              `;
          }
      }).catch(error => {
          document.getElementById("status").innerText = "生成失败";
          document.getElementById("status").classList.add("error");
          document.getElementById("results").innerHTML = `<div class="result-card"><h3>错误</h3><div class="rc-body">${error}</div></div>`;
      });
}

// 初始化
preset("场景A");
</script>
</body>
</html>
