<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄酒项目语音问答 Demo</title>
    <style>
        body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background-color: #f5f5f5; color: #333; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #d35400; }
        form { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        textarea { resize: vertical; height: 100px; }
        button { width: 100%; padding: 12px; background-color: #e67e22; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .loading { text-align: center; margin-top: 20px; }
        .result { margin-top: 30px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); white-space: pre-wrap; }
        .error { margin-top: 30px; color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>黄酒项目语音问答 Demo</h1>
        <form id="demoForm">
            <div class="form-group">
                <label for="customerType">客户类型</label>
                <select id="customerType" name="customerType" required>
                    <option value="">请选择</option>
                    <option value="个人">个人</option>
                    <option value="企业">企业</option>
                </select>
            </div>
            <div class="form-group">
                <label for="inquiryType">咨询类型</label>
                <select id="inquiryType" name="inquiryType" required>
                    <option value="">请选择</option>
                    <option value="价格">价格</option>
                    <option value="产品信息">产品信息</option>
                    <option value="购买方式">购买方式</option>
                    <option value="售后">售后</option>
                </select>
            </div>
            <div class="form-group">
                <label for="specificQuestion">具体问题</label>
                <textarea id="specificQuestion" name="specificQuestion" placeholder="请输入您的问题" required></textarea>
            </div>
            <button type="submit" id="generateButton">生成 / 运行</button>
            <div class="loading" id="loading" style="display:none;">
                <p>正在生成，请稍候...</p>
            </div>
        </form>
        <div id="result" class="result" style="display:none;"></div>
        <div id="error" class="error" style="display:none;"></div>
    </div>

    <script>
        document.getElementById('demoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const customerType = document.getElementById('customerType').value;
            const inquiryType = document.getElementById('inquiryType').value;
            const specificQuestion = document.getElementById('specificQuestion').value;

            if (!customerType || !inquiryType || !specificQuestion) {
                alert('请填写所有字段');
                return;
            }

            const data = {
                customerType,
                inquiryType,
                specificQuestion
            };

            const generateButton = document.getElementById('generateButton');
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');

            generateButton.disabled = true;
            loading.style.display = 'block';
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('网络响应不是OK');
                }

                const responseData = await response.json();
                resultDiv.textContent = responseData.result;
                resultDiv.style.display = 'block';
            } catch (error) {
                errorDiv.textContent = '发生错误，请稍后再试。';
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                generateButton.disabled = false;
            }
        });
    </script>
</body>
</html
