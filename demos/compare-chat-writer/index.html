<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄酒语音问答 Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            margin-bottom: 8px;
            font-weight: 500;
            display: block;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: #2980b9;
            outline: none;
        }
        button {
            padding: 12px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #7f8c8d;
        }
        .result {
            margin-top: 30px;
            white-space: pre-wrap;
            border-top: 1px solid #ecf0f1;
            padding-top: 20px;
            font-size: 16px;
            line-height: 1.6;
        }
        .error {
            margin-top: 20px;
            color: #e74c3c;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>黄酒项目语音问答 Demo</h1>
        <form id="demoForm">
            <div class="form-group">
                <label for="question">问题描述</label>
                <textarea id="question" rows="3" placeholder="请输入您的问题，例如：黄酒的价格是多少？"></textarea>
            </div>
            <div class="form-group">
                <label for="userType">用户类型</label>
                <select id="userType">
                    <option value="普通用户">普通用户</option>
                    <option value="中老年用户">中老年用户</option>
                    <option value="企业用户">企业用户</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dialect">方言偏好</label>
                <select id="dialect">
                    <option value="普通话">普通话</option>
                    <option value="山西话">山西话</option>
                    <option value="其他方言">其他方言</option>
                </select>
            </div>
            <button type="submit">生成 / 运行</button>
            <div class="loading" id="loading" style="display:none;">生成中，请稍候...</div>
        </form>
        <div class="result" id="result" style="display:none;"></div>
        <div class="error" id="error" style="display:none;"></div>
    </div>
    <script>
        document.getElementById('demoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const question = document.getElementById('question').value.trim();
            const userType = document.getElementById('userType').value;
            const dialect = document.getElementById('dialect').value;
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');

            if (!question) {
                alert('请输入您的问题');
                return;
            }

            loading.style.display = 'block';
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: question,
                        userType: userType,
                        dialect: dialect
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerText = data.result;
                    resultDiv.style.display = 'block';
                } else {
                    errorDiv.innerText = data.error || '发生错误，请稍后再试';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = '网络错误，请检查您的连接';
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html
