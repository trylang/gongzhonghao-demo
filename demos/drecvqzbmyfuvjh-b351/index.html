<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄酒语音问答 Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            flex: 1;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-top: 0;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            margin-top: 20px;
            padding: 15px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #8eb8e8;
            cursor: not-allowed;
        }
        .loading {
            margin-top: 20px;
            font-size: 18px;
            color: #4a90e2;
        }
        .error {
            margin-top: 20px;
            font-size: 18px;
            color: red;
        }
        .result {
            margin-top: 20px;
            white-space: pre-wrap;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <header>
        <h1>黄酒项目语音问答 Demo</h1>
    </header>
    <main>
        <form id="demoForm">
            <label for="question">请输入您的问题：</label>
            <input type="text" id="question" name="question" placeholder="例如：黄酒的价格是多少？" required>

            <label for="scenario">选择场景：</label>
            <select id="scenario" name="scenario" required>
                <option value="" disabled selected>请选择场景</option>
                <option value="售前咨询">售前咨询</option>
                <option value="售后服务">售后服务</option>
                <option value="产品信息">产品信息</option>
            </select>

            <label for="userType">用户类型：</label>
            <select id="userType" name="userType" required>
                <option value="" disabled selected>请选择用户类型</option>
                <option value="个人用户">个人用户</option>
                <option value="企业用户">企业用户</option>
            </select>

            <button type="submit">生成 / 运行</button>
        </form>

        <div id="loading" class="loading" style="display: none;">生成中，请稍候...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="result" class="result" style="display: none;"></div>
    </main>

    <script>
        document.getElementById('demoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').style.display = 'none';

            const formData = {
                question: e.target.question.value,
                scenario: e.target.scenario.value,
                userType: e.target.userType.value
            };

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('网络响应不是OK');
                }

                const data = await response.json();
                document.getElementById('result').textContent = data.result;
                document.getElementById('result').style.display = 'block';
            } catch (err) {
                document.getElementById('error').textContent = '发生错误，请稍后再试。';
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html
