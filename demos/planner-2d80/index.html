<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI驱动的电商数据看板生成器</title>
    <style>
:root{
  --bg:#f6f3ee; --card:#fffdfa; --ink:#3a352f; --ink-soft:#756c64;
  --accent:#a65d4c; --accent-deep:#6d453a; --accent-soft:#f3e7e1;
  --line:#e6ded3; --line-strong:#d8cdbc;
  --ok:#4f7a4c; --warn:#b42318;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(109,69,58,.08);
  --maxw:1080px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
/* hero（顶部价值主张，禁止只放一个孤零零的 h1） */
.hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fbf4ee;padding:46px 0 38px;text-align:center}
.hero .kicker{letter-spacing:2px;font-size:12.5px;opacity:.85;margin:0 0 10px}
.hero h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 12px;font-weight:600}
.hero .sub{max-width:720px;margin:0 auto;opacity:.92;font-size:14.5px}
.hero .sub strong{color:#ffe2d3}
main{padding:30px 0 56px}
/* 双栏布局：左输入卡 / 右结果卡 */
.layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px;color:var(--accent-deep)}
.card .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}
/* 表单（最小必要字段，优先 select/预设） */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field>span{font-size:13px;color:var(--ink-soft)}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* 按钮（唯一主按钮 + 少量次要 + 胶囊示例） */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary.big{padding:13px 24px;font-size:15.5px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{border:1px solid var(--line);background:#fff;color:var(--accent-deep);padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.15s}
.pill:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.danger{color:var(--warn);border-color:#ecc9c5}
.pill.danger:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
/* 结果可视化（禁止死表格/纯文本） */
.results{display:grid;gap:16px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
/* 状态 */
.status{font-size:12.5px;color:var(--ink-soft);margin-top:8px;min-height:16px}
.loading{color:var(--ink-soft)}
.error{color:var(--warn)}
/* 底部理念 */
.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:22px}
.foot strong{color:var(--accent-deep)}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div id="data-intake"></div>
    <div class="wrap">
        <section class="hero">
            <div class="kicker">电商数据分析工具</div>
            <h1>AI驱动的电商数据看板生成器</h1>
            <div class="sub">无需复杂配置，无需专业技能，轻松生成每日发货量、复购率、客单价等关键指标的可视化看板。让您的决策更精准、更高效。</div>
        </section>
        <main>
            <div class="layout">
                <div class="card">
                    <h2>输入您的数据</h2>
                    <div class="hint">选择您的数据来源，或上传您的数据文件。</div>
                    <div class="form-grid">
                        <div class="field">
                            <label for="data-source">数据来源</label>
                            <select id="data-source" name="data-source">
                                <option value="wechat">微信订单</option>
                                <option value="douyin">抖音小店</option>
                                <option value="kuaidi">快递100</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="date-range">日期范围</label>
                            <input type="date" id="date-range" name="date-range" placeholder="选择日期范围">
                        </div>
                        <div class="field wide">
                            <label for="upload">上传您的数据文件</label>
                            <input type="file" id="upload" name="upload" accept=".csv,.xlsx">
                        </div>
                        <div class="field">
                            <button class="btn primary big" id="generate-btn">生成看板</button>
                            <button class="btn ghost" id="clear-btn">清空</button>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <h2>生成结果</h2>
                    <div class="results" id="results">
                        <div class="result-card">
                            <h3>每日发货量</h3>
                            <p>示例数据：500件</p>
                            <p>（图表：发货量趋势图）</p>
                        </div>
                        <div class="result-card">
                            <h3>复购率</h3>
                            <p>示例数据：15%</p>
                            <p>（图表：复购率趋势图）</p>
                        </div>
                        <div class="result-card">
                            <h3>客单价</h3>
                            <p>示例数据：200元</p>
                            <p>（图表：客单价趋势图）</p>
                        </div>
                    </div>
                    <div class="status" id="status"></div>
                </div>
            </div>
        </main>
        <footer class="foot">
            <p><strong>AI驱动，决策更精准。</strong> 让您的电商业务更上一层楼。</p>
        </footer>
    </div>
    <script>
        // 示例数据
        const SEED = {
            "daily_shipments": 500,
            "repeat_purchase_rate": "15%",
            "average_order_value": "200元",
            "charts": {
                "daily_shipments_trend": "（图表：发货量趋势图）",
                "repeat_purchase_rate_trend": "（图表：复购率趋势图）",
                "average_order_value_trend": "（图表：客单价趋势图）"
            }
        };

        // 数据入口组件
        window.DATA_SCHEMA = {
            name: "电商订单数据",
            columns: [
                { key: "order_no", label: "订单号", type: "text", example: "SO...", required: true },
                { key: "customer_id", label: "客户ID", type: "text", example: "C12345", required: true },
                { key: "order_date", label: "订单日期", type: "date", example: "2023-10-01", required: true },
                { key: "product_id", label: "产品ID", type: "text", example: "P67890", required: true },
                { key: "quantity", label: "数量", type: "number", example: "2", required: true },
                { key: "price", label: "单价", type: "number", example: "100", required: true },
                { key: "shipping_date", label: "发货日期", type: "date", example: "2023-10-02", required: false }
            ],
            sample: [
                { "order_no": "SO123456", "customer_id": "C12345", "order_date": "2023-10-01", "product_id": "P67890", "quantity": 2, "price": 100, "shipping_date": "2023-10-02" },
                { "order_no": "SO234567", "customer_id": "C12346", "order_date": "2023-10-01", "product_id": "P67891", "quantity": 1, "price": 200, "shipping_date": "2023-10-02" },
                { "order_no": "SO345678", "customer_id": "C12347", "order_date": "2023-10-02", "product_id": "P67892", "quantity": 3, "price": 150, "shipping_date": "2023-10-03" }
            ],
            maxRows: 300
        };

        // 生成按钮点击事件
        document.getElementById("generate-btn").addEventListener("click", () => {
            // 获取数据
            let inputs = {};
            if (window.DataIntake && window.DataIntake.isReady()) {
                inputs.data = window.DataIntake.getPayload();
            } else {
                inputs = SEED;
            }

            // 发送 POST 请求
            fetch("/api/generate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ "inputs": inputs })
            })
            .then(response => response.json())
            .then(data => {
                // 处理返回的数据
                if (data && data.daily_shipments) {
                    // 更新结果卡片
                    document.getElementById("results").innerHTML = `
                        <div class="result-card">
                            <h3>每日发货量</h3>
                            <p>${data.daily_shipments}</p>
                            <p>${data.daily_shipments_chart}</p>
                        </div>
                        <div class="result-card">
                            <h3>复购率</h3>
                            <p>${data.repeat_purchase_rate}</p>
                            <p>${data.repeat_purchase_rate_chart}</p>
                        </div>
                        <div class="result-card">
                            <h3>客单价</h3>
                            <p>${data.average_order_value}</p>
                            <p>${data.average_order_value_chart}</p>
                        </div>
                    `;
                } else {
                    // 显示错误信息
                    document.getElementById("status").innerText = "生成失败，请重试。";
                }
            })
            .catch(error => {
                // 显示错误信息
                document.getElementById("status").innerText = "生成失败，请重试。";
            });
        });

        // 清空按钮点击事件
        document.getElementById("clear-btn").addEventListener("click", () => {
            // 清空输入字段
            document.getElementById("data-source").value = "";
            document.getElementById("date-range").value = "";
            document.getElementById("upload").value = "";
            // 清空结果卡片
            document.getElementById("results").innerHTML = `
                <div class="result-card">
                    <h3>每日发货量</h3>
                    <p>示例数据：500件</p>
                    <p>（图表：发货量趋势图）</p>
                </div>
                <div class="result-card">
                    <h3>复购率</h3>
                    <p>示例数据：15%</p>
                    <p>（图表：复购率趋势图）</p>
                </div>
                <div class="result-card">
                    <h3>客单价</h3>
                    <p>示例数据：200元</p>
                    <p>（图表：客单价趋势图）</p>
                </div>
            `;
            // 清空状态
            document.getElementById("status").innerText = "";
        });
    </script>
</body>
</html>
