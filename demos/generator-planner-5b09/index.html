<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>代州黄酒短视频脚本批量生成器</title>
    <style>
        :root {
            --main-color: #5e342e;
            --background-color: #f5f5f5;
            --text-color: #333;
            --border-color: #ccc;
            --button-color: #8b5e3c;
            --button-hover-color: #a26d4d;
            --box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1em;
        }
        #container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        .section {
            margin-bottom: 30px;
        }
        .section h2 {
            border-bottom: 2px solid var(--main-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--main-color);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .controls button {
            flex: 1 1 150px;
            padding: 10px;
            background-color: var(--button-color);
            color: #fff;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        .controls button:hover {
            background-color: var(--button-hover-color);
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1em;
        }
        .result {
            margin-top: 30px;
        }
        .result h3 {
            color: var(--main-color);
            margin-bottom: 15px;
        }
        .result pre {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: var(--border-radius);
            overflow: auto;
        }
        .example-result {
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: var(--border-radius);
            background-color: #f1f1f1;
        }
        .example-result h4 {
            margin-top: 0;
            color: var(--main-color);
        }
        .example-result p {
            margin-bottom: 10px;
        }
        .buttons-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .buttons-group button {
            flex: 1 1 150px;
        }
        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
            }
            .buttons-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="data-intake"></div>
    <div id="container">
        <header>
            <h1>代州黄酒短视频脚本批量生成器</h1>
            <p>用 GPT-5.6 Luna 快速生成高质量口播脚本和分镜，助您高效进行内容营销</p>
        </header>
        <div class="section">
            <h2>产品卖点输入</h2>
            <div class="input-group">
                <label for="product-feature">产品卖点</label>
                <textarea id="product-feature" rows="4" placeholder="请输入产品卖点，例如：传统酿造工艺，纯手工制作"></textarea>
            </div>
            <div class="input-group">
                <label for="video-length">视频时长</label>
                <select id="video-length">
                    <option value="30">30秒</option>
                    <option value="60">60秒</option>
                </select>
            </div>
        </div>
        <div class="section">
            <h2>操作选项</h2>
            <div class="controls">
                <div class="buttons-group">
                    <button id="generate-button">生成脚本</button>
                    <button id="clear-button">清空/重填</button>
                    <button id="random-button">随机示例</button>
                    <button id="copy-button">复制结果</button>
                    <button id="export-button">导出 JSON</button>
                </div>
                <div class="buttons-group">
                    <button class="preset-button" data-preset="A">场景A</button>
                    <button class="preset-button" data-preset="B">场景B</button>
                    <button class="preset-button" data-preset="C">场景C</button>
                </div>
            </div>
        </div>
        <div class="section">
            <h2>生成结果</h2>
            <div id="result" class="result">
                <div class="example-result">
                    <h4>示例脚本（30秒）</h4>
                    <p>欢迎来到代州黄酒的世界！我们的黄酒采用传统酿造工艺，纯手工制作，口感醇厚，回味悠长。无论是家庭聚会还是节日庆典，代州黄酒都是您的最佳选择。立即购买，享受高品质黄酒带来的美好时光。</p>
                    <h4>示例分镜</h4>
                    <pre>
镜头1: 镜头缓慢推进，展示代州黄酒的瓶身和酒液。
镜头2: 镜头切换到酿酒师手工酿造的场景。
镜头3: 镜头展示家庭聚会，人们举杯共饮。
镜头4: 代州黄酒的特写，字幕显示“代州黄酒，传承经典”。
                    </pre>
                </div>
            </div>
        </div>
    </div>
    <script>
        // window.DATA_SCHEMA = {
        //     name: "产品卖点",
        //     columns: [
        //         { key: "product_feature", label: "产品卖点", type: "text", example: "传统酿造工艺", required: true },
        //         { key: "video_length", label: "视频时长", type: "number", example: "30", required: true }
        //     ],
        //     sample: [
        //         { product_feature: "传统酿造工艺", video_length: 30 },
        //         { product_feature: "纯手工制作", video_length: 60 },
        //         { product_feature: "口感醇厚", video_length: 30 },
        //         { product_feature: "回味悠长", video_length: 60 },
        //         { product_feature: "家庭聚会首选", video_length: 30 },
        //         { product_feature: "节日庆典必备", video_length: 60 },
        //         { product_feature: "高品质黄酒", video_length: 30 },
        //         { product_feature: "代州黄酒，传承经典", video_length: 60 }
        //     ],
        //     maxRows: 300
        // };

        const SEED = [
            {
                product_feature: "传统酿造工艺",
                video_length: 30
            },
            {
                product_feature: "纯手工制作",
                video_length: 60
            },
            {
                product_feature: "口感醇厚",
                video_length: 30
            },
            {
                product_feature: "回味悠长",
                video_length: 60
            },
            {
                product_feature: "家庭聚会首选",
                video_length: 30
            },
            {
                product_feature: "节日庆典必备",
                video_length: 60
            },
            {
                product_feature: "高品质黄酒",
                video_length: 30
            },
            {
                product_feature: "代州黄酒，传承经典",
                video_length: 60
            }
        ];

        let currentPreset = 'A';

        document.getElementById('generate-button').addEventListener('click', () => {
            const productFeature = document.getElementById('product-feature').value.trim();
            const videoLength = document.getElementById('video-length').value;
            let inputs = {
                product_feature: productFeature,
                video_length: parseInt(videoLength)
            };
            if (window.DataIntake && window.DataIntake.isReady()) {
                inputs.data = window.DataIntake.getPayload();
            } else {
                inputs.data = SEED;
            }
            fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ inputs: inputs })
            })
            .then(response => response.json())
            .then(data => {
                renderResult(data);
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });

        document.getElementById('clear-button').addEventListener('click', () => {
            document.getElementById('product-feature').value = '';
            document.getElementById('video-length').value = '30';
            document.getElementById('result').innerHTML = '';
        });

        document.getElementById('random-button').addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * SEED.length);
            const randomExample = SEED[randomIndex];
            document.getElementById('product-feature').value = randomExample.product_feature;
            document.getElementById('video-length').value = randomExample.video_length.toString();
        });

        document.getElementById('copy-button').addEventListener('click', () => {
            const result = document.getElementById('result').innerText;
            navigator.clipboard.writeText(result).then(() => {
                alert('结果已复制到剪贴板');
            }).catch(err => {
                console.error('复制失败:', err);
            });
        });

        document.getElementById('export-button').addEventListener('click', () => {
            const result = document.getElementById('result').innerText;
            const blob = new Blob([result], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'script_result.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.querySelectorAll('.preset-button').forEach(button => {
            button.addEventListener('click', () => {
                currentPreset = button.getAttribute('data-preset');
                const presetData = getPresetData(currentPreset);
                document.getElementById('product-feature').value = presetData.product_feature;
                document.getElementById('video-length').value = presetData.video_length.toString();
            });
        });

        function getPresetData(preset) {
            switch(preset) {
                case 'A':
                    return {
                        product_feature: "传统酿造工艺",
                        video_length: 30
                    };
                case 'B':
                    return {
                        product_feature: "纯手工制作",
                        video_length: 60
                    };
                case 'C':
                    return {
                        product_feature: "代州黄酒，传承经典",
                        video_length: 60
                    };
                default:
                    return {
                        product_feature: "传统酿造工艺",
                        video_length: 30
                    };
            }
        }

        function renderResult(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <h3>脚本生成结果</h3>
                <div>
                    <p><strong>30秒脚本:</strong></p>
                    <p>${data['30秒脚本']}</p>
                </div>
                <div>
                    <p><strong>60秒脚本:</strong></p>
                    <p>${data['60秒脚本']}</p>
                </div>
                <div>
                    <p><strong>分镜:</strong></p>
                    <pre>${data['分镜']}</pre>
                </div>
            `;
        }
    </script>
</body>
</html>
