<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>代州黄酒短视频脚本批量生成器</title>
  <style>
:root{
  --bg:#f6f3ee; --card:#fffdfa; --ink:#3a352f; --ink-soft:#756c64;
  --accent:#a65d4c; --accent-deep:#6d453a; --accent-soft:#f3e7e1;
  --line:#e6ded3; --line-strong:#d8cdbc;
  --ok:#4f7a4f; --warn:#b42318;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(109,69,58,.08);
  --maxw:1080px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
/* hero（顶部价值主张，禁止只放一个孤零零的 h1） */
.hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fbf4ee;padding:46px 0 38px;text-align:center}
.hero .kicker{letter-spacing:2px;font-size:12.5px;opacity:.85;margin:0 0 10px}
.hero h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 12px;font-weight:600}
.hero .sub{max-width:720px;margin:0 auto;opacity:.92;font-size:14.5px}
.hero .sub strong{color:#ffe2d3}
main{padding:30px 0 56px}
/* 双栏布局：左输入卡 / 右结果卡 */
.layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px;color:var(--accent-deep)}
.card .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}
/* 表单（最小必要字段，优先 select/预设） */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field>span{font-size:13px;color:var(--ink-soft)}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* 按钮（唯一主按钮 + 少量次要 + 胶囊示例） */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary.big{padding:13px 24px;font-size:15.5px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{border:1px solid var(--line);background:#fff;color:var(--accent-deep);padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.15s}
.pill:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.danger{color:var(--warn);border-color:#ecc9c5}
.pill.danger:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
/* 结果可视化（禁止死表格/纯文本） */
.results{display:grid;gap:16px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
/* 状态 */
.status{font-size:12.5px;color:var(--ink-soft);margin-top:8px;min-height:16px}
.loading{color:var(--ink-soft)}
.error{color:var(--warn)}
/* 底部理念 */
.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:22px}
.foot strong{color:var(--accent-deep)}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="data-intake"></div>
  <div class="wrap">
    <header class="hero">
      <div class="kicker">AI 营销工具</div>
      <h1>代州黄酒短视频脚本批量生成器</h1>
      <div class="sub">输入一个卖点，自动生成 30 秒/60 秒口播脚本和分镜，助您轻松制作专业短视频内容。</div>
    </header>
    <main>
      <div class="layout">
        <div class="card">
          <h2>输入卖点信息</h2>
          <div class="form-grid">
            <div class="field">
              <span>产品名称</span>
              <input type="text" id="product-name" placeholder="例如：代州黄酒">
            </div>
            <div class="field">
              <span>主要卖点</span>
              <input type="text" id="main-feature" placeholder="例如：传统酿造工艺">
            </div>
            <div class="field">
              <span>目标时长</span>
              <select id="duration">
                <option value="30">30 秒</option>
                <option value="60">60 秒</option>
              </select>
            </div>
            <div class="field wide">
              <span>其他补充信息（可选）</span>
              <textarea id="additional-info" rows="3" placeholder="例如：历史背景、获奖情况等"></textarea>
            </div>
          </div>
          <div class="actions">
            <button id="generate-btn" class="btn primary big" disabled>生成脚本</button>
            <button id="clear-btn" class="btn ghost">清空</button>
            <div class="pill danger" id="reset-btn">重置为示例</div>
          </div>
        </div>
        <div class="card">
          <h2>生成结果</h2>
          <div class="results" id="results">
            <div class="result-card" id="sample-result">
              <p>点击「生成脚本」按钮查看示例结果。</p>
            </div>
          </div>
          <div class="status" id="status"></div>
        </div>
      </div>
    </main>
  </div>
  <footer class="foot">
    <strong>AI 驱动的营销工具</strong>，让您的内容创作更高效。
  </footer>
  <script>
const SEED = {
  productName: "代州黄酒",
  mainFeature: "传统酿造成就经典",
  duration: "30",
  additionalInfo: "拥有百年历史，多次荣获国家级奖项"
};

const SAMPLE_RESULT = {
  "30秒脚本": "大家好，今天给大家介绍代州黄酒。代州黄酒以其传统酿造工艺和百年历史而闻名。每一瓶黄酒都经过精心酿造，保留了最纯正的风味。无论是家庭聚餐还是节日庆典，代州黄酒都是您的最佳选择。立即品尝，感受经典魅力！",
  "60秒脚本": "大家好，今天我要向大家推荐一款极具传统魅力的酒品——代州黄酒。代州黄酒拥有百年历史，采用传统酿造工艺，酿造出最纯正的风味。每一瓶黄酒都经过多道工序精心酿造，确保了口感的独特和品质的卓越。无论是家庭聚会还是节日庆典，代州黄酒都是您的最佳选择。代州黄酒不仅口感醇厚，还多次荣获国家级奖项，是您品味传统文化的最佳选择。立即购买代州黄酒，让您的餐桌更添光彩！",
  "分镜脚本": [
    {
      "镜头": "1",
      "描述": "全景展示代州黄酒的酿造过程",
      "时长": "10秒"
    },
    {
      "镜头": "2",
      "描述": "特写展示代州黄酒的瓶身和标签",
      "时长": "5秒"
    },
    {
      "镜头": "3",
      "描述": "展示人们在各种场合饮用代州黄酒的场景",
      "时长": "15秒"
    },
    {
      "镜头": "4",
      "描述": "特写展示代州黄酒的品尝瞬间",
      "时长": "5秒"
    }
  ]
};

window.DATA_SCHEMA = {
  name: "黄酒卖点",
  columns: [
    { key: "productName", label: "产品名称", type: "text", example: "代州黄酒", required: true },
    { key: "mainFeature", label: "主要卖点", type: "text", example: "传统酿造工艺", required: true },
    { key: "duration", label: "目标时长", type: "select", options: ["30", "60"], required: true },
    { key: "additionalInfo", label: "其他补充信息", type: "text", example: "百年历史，获奖情况", required: false }
  ],
  sample: [
    { productName: "代州黄酒", mainFeature: "传统酿造工艺", duration: "30", additionalInfo: "百年历史，获奖情况" },
    { productName: "代州黄酒", mainFeature: "独特风味", duration: "60", additionalInfo: "多次获奖，家庭聚会首选" },
    { productName: "代州黄酒", mainFeature: "历史悠久", duration: "30", additionalInfo: "传统工艺，品质保证" }
  ],
  maxRows: 300
};

document.addEventListener("DOMContentLoaded", () => {
  const generateBtn = document.getElementById("generate-btn");
  const clearBtn = document.getElementById("clear-btn");
  const resetBtn = document.getElementById("reset-btn");
  const results = document.getElementById("results");
  const sampleResult = document.getElementById("sample-result");
  const status = document.getElementById("status");

  // DataIntake integration
  const dataIntake = window.DataIntake;
  if (dataIntake) {
    dataIntake.init({
      schema: window.DATA_SCHEMA,
      onReady: () => {
        if (dataIntake.isReady()) {
          generateBtn.disabled = false;
        }
      },
      onDataChange: () => {
        if (dataIntake.isReady()) {
          generateBtn.disabled = false;
        } else {
          generateBtn.disabled = true;
        }
      }
    });
  } else {
    // Pre-fill with seed data
    document.getElementById("product-name").value = SEED.productName;
    document.getElementById("main-feature").value = SEED.mainFeature;
    document.getElementById("duration").value = SEED.duration;
    document.getElementById("additional-info").value = SEED.additionalInfo;
    generateBtn.disabled = false;
  }

  // Generate button click handler
  generateBtn.addEventListener("click", () => {
    status.textContent = "生成中...";
    generateBtn.disabled = true;
    clearBtn.disabled = true;
    resetBtn.disabled = true;

    const inputs = {
      productName: document.getElementById("product-name").value.trim(),
      mainFeature: document.getElementById("main-feature").value.trim(),
      duration: document.getElementById("duration").value,
      additionalInfo: document.getElementById("additional-info").value.trim()
    };

    if (dataIntake && dataIntake.isReady()) {
      inputs.data = dataIntake.getPayload();
    }

    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ inputs: inputs })
    })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          status.textContent = "发生错误: " + data.error;
          generateBtn.disabled = false;
          clearBtn.disabled = false;
          resetBtn.disabled = false;
        } else {
          results.innerHTML = "";
          for (const key in data) {
            const resultCard = document.createElement("div");
            resultCard.className = "result-card";
            resultCard.innerHTML = `<h3>${key}</h3><p>${data[key]}</p>`;
            results.appendChild(resultCard);
          }
          status.textContent = "";
          generateBtn.disabled = false;
          clearBtn.disabled = false;
          resetBtn.disabled = false;
        }
      })
      .catch(error => {
        status.textContent = "请求失败: " + error;
        generateBtn.disabled = false;
        clearBtn.disabled = false;
        resetBtn.disabled = false;
      });
  });

  // Clear button click handler
  clearBtn.addEventListener("click", () => {
    document.getElementById("product-name").value = "";
    document.getElementById("main-feature").value = "";
    document.getElementById("duration").value = "";
    document.getElementById("additional-info").value = "";
    results.innerHTML = "";
    status.textContent = "";
    generateBtn.disabled = true;
  });

  // Reset button click handler
  resetBtn.addEventListener("click", () => {
    document.getElementById("product-name").value = SEED.productName;
    document.getElementById("main-feature").value = SEED.mainFeature;
    document.getElementById("duration").value = SEED.duration;
    document.getElementById("additional-info").value = SEED.additionalInfo;
    results.innerHTML = "";
    status.textContent = "";
    generateBtn.disabled = false;
  });
});
  </script>
</body>
</html>
