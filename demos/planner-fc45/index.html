<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI效率提升预测工具</title>
    <style>
        :root {
            --main-color: #2c3e50;
            --background-color: #f5f5f5;
            --text-color: #333;
            --border-radius: 8px;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
        h1 {
            text-align: center;
            color: var(--main-color);
        }
        .step {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: var(--border-radius);
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            background-color: var(--main-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: var(--main-color);
        }
        .error {
            color: red;
            margin-top: 20px;
            text-align: center;
        }
        .result {
            margin-top: 30px;
        }
        .result h2 {
            color: var(--main-color);
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .result ul {
            list-style-type: none;
            padding: 0;
        }
        .result li {
            background-color: #eef2f3;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: var(--border-radius);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI效率提升预测工具</h1>
        <div class="step">
            <label for="industry">您的行业:</label>
            <input type="text" id="industry" placeholder="例如：酒业、餐饮、零售">
        </div>
        <div class="step">
            <label for="process">希望提升的环节:</label>
            <input type="text" id="process" placeholder="例如：内容生产、客户沟通、数据分析">
        </div>
        <div class="step">
            <label for="current-time">当前完成时间（小时）:</label>
            <input type="number" id="current-time" placeholder="例如：2">
        </div>
        <div class="step">
            <label for="target-improvement">预期提升倍数:</label>
            <select id="target-improvement">
                <option value="2">2倍</option>
                <option value="3">3倍</option>
                <option value="4">4倍</option>
                <option value="5">5倍</option>
            </select>
        </div>
        <button id="generate-btn">生成分析结果</button>
        <div id="loading" class="loading" style="display:none;">分析中，请稍候...</div>
        <div id="error" class="error" style="display:none;">发生错误，请稍后再试。</div>
        <div id="result" class="result" style="display:none;">
            <h2>分析结果:</h2>
            <ul id="result-list"></ul>
        </div>
    </div>

    <script>
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const industry = document.getElementById('industry').value.trim();
            const process = document.getElementById('process').value.trim();
            const currentTime = parseFloat(document.getElementById('current-time').value);
            const targetImprovement = parseInt(document.getElementById('target-improvement').value);

            if (!industry || !process || isNaN(currentTime) || isNaN(targetImprovement)) {
                alert('请完整填写所有字段。');
                return;
            }

            const inputs = {
                industry,
                process,
                currentTime,
                targetImprovement
            };

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inputs })
                });

                const data = await response.json();
                if (response.ok) {
                    const result = JSON.parse(data.result);
                    renderResult(result);
                } else {
                    document.getElementById('error').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });

        function renderResult(result) {
            const list = document.getElementById('result-list');
            list.innerHTML = '';

            const li1 = document.createElement('li');
            li1.innerHTML = `<strong>当前完成时间:</strong> ${result.currentTime} 小时`;
            list.appendChild(li1);

            const li2 = document.createElement('li');
            li2.innerHTML = `<strong>预期提升后完成时间:</strong> ${result.targetTime} 小时`;
            list.appendChild(li2);

            const li3 = document.createElement="li""><strong>效率提升倍数:</strong> ${result.efficiencyImprovement} 倍</li>";
            list.appendChild(li3);

            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
