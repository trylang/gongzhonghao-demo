<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Diátaxis 文档结构分析工具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; background-color: #f5f5f5; color: #333; margin: 0; padding: 0; display: flex; justify-content: center; }
        .container { max-width: 800px; padding: 20px; background-color: #fff; margin: 30px 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; }
        h1 { text-align: center; margin-bottom: 30px; color: #2c3e50; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; margin-bottom: 5px; }
        textarea, input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; resize: vertical; }
        textarea { height: 150px; }
        button { padding: 12px; background-color: #3498db; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #2980b9; }
        .loading { text-align: center; margin-top: 20px; }
        .result { margin-top: 30px; border-top: 1px solid #e0e0e0; padding-top: 20px; }
        .result h2 { margin-top: 0; color: #27ae60; }
        .error { margin-top: 30px; color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Diátaxis 文档结构分析工具</h1>
        <form id="generate-form">
            <label for="product-description">产品描述 (例如：产品介绍、README)</label>
            <textarea id="product-description" name="productDescription" placeholder="请输入产品描述内容..." required></textarea>

            <label for="target-audience">目标受众 (例如：新手用户、高级用户)</label>
            <input type="text" id="target-audience" name="targetAudience" placeholder="请输入目标受众" required>

            <label for="document-type">文档类型</label>
            <select id="document-type" name="documentType" required>
                <option value="" disabled selected>请选择文档类型</option>
                <option value="tutorial">教程 (Tutorials)</option>
                <option value="how-to">操作指南 (How-to Guides)</option>
                <option value="reference">技术参考 (Technical Reference)</option>
                <option value="explanation">原理阐述 (Explanation)</option>
            </select>

            <button type="submit">生成分析</button>
        </form>

        <div id="result-section" class="result" style="display: none;">
            <h2>分析结果</h2>
            <p id="analysis-result"></p>
        </div>

        <div id="error-section" class="error" style="display: none;">
            <p id="error-message"></p>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <p>分析中，请稍候...</p>
        </div>
    </div>

    <script>
        document.getElementById('generate-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('error-section').style.display = 'none';

            const productDescription = document.getElementById('product-description').value;
            const targetAudience = document.getElementById('target-audience').value;
            const documentType = document.getElementById('document-type').value;

            const data = {
                productDescription,
                targetAudience,
                documentType
            };

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('网络响应不是OK');
                }

                const result = await response.json();
                document.getElementById('analysis-result').innerText = result.result;
                document.getElementById('result-section').style.display = 'block';
            } catch (error) {
                document.getElementById('error-message').innerText = '发生错误，请稍后重试。';
                document.getElementById('error-section').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html
