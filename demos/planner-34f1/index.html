<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商数据洞察工具</title>
    <style>
:root{
  --bg:#f6f3ee; --card:#fffdfa; --ink:#3a352f; --ink-soft:#756c64;
  --accent:#a65d4c; --accent-deep:#6d453a; --accent-soft:#f3e7e1;
  --line:#e6ded3; --line-strong:#d8cdbc;
  --ok:#4f7a4f; --warn:#b42318;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(109,69,58,.08);
  --maxw:1080px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
/* hero（顶部价值主张，禁止只放一个孤零零的 h1） */
.hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fbf4ee;padding:46px 0 38px;text-align:center}
.hero .kicker{letter-spacing:2px;font-size:12.5px;opacity:.85;margin:0 0 10px}
.hero h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 12px;font-weight:600}
.hero .sub{max-width:720px;margin:0 auto;opacity:.92;font-size:14.5px}
.hero .sub strong{color:#ffe2d3}
main{padding:30px 0 56px}
/* 双栏布局：左输入卡 / 右结果卡 */
.layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px;color:var(--accent-deep)}
.card .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}
/* 表单（最小必要字段，优先 select/预设） */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field>span{font-size:13px;color:var(--ink-soft)}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* 按钮（唯一主按钮 + 少量次要 + 胶囊示例） */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary.big{padding:13px 24px;font-size:15.5px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{border:1px solid var(--line);background:#fff;color:var(--accent-deep);padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.15s}
.pill:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.danger{color:var(--warn);border-color:#ecc9c5}
.pill.danger:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
/* 结果可视化（禁止死表格/纯文本） */
.results{display:grid;gap:16px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
/* 状态 */
.status{font-size:12.5px;color:var(--ink-soft);margin-top:8px;min-height:16px}
.loading{color:var(--ink-soft)}
.error{color:var(--warn)}
/* 底部理念 */
.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:22px}
.foot strong{color:var(--accent-deep)}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div id="data-intake"></div>
    <div class="wrap">
        <div class="hero">
            <div class="kicker">电商数据分析</div>
            <h1>AI 助力电商数据洞察</h1>
            <div class="sub">无需复杂系统，轻松生成每日发货量、复购率、客单价等关键指标，助您快速掌握业务动态。</div>
        </div>
        <main>
            <div class="layout">
                <div class="card">
                    <h2>输入参数</h2>
                    <div class="form-grid">
                        <div class="field">
                            <label for="data-source">数据来源</label>
                            <select id="data-source" name="data-source">
                                <option value="wechat">微信订单</option>
                                <option value="douyin">抖音小店</option>
                                <option value="kuaidi100">快递100</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="date-range">日期范围</label>
                            <input type="date" id="start-date" name="start-date">
                            <input type="date" id="end-date" name="end-date">
                        </div>
                        <div class="field wide">
                            <label for="scenario-presets">场景预设</label>
                            <div class="actions">
                                <button class="pill" onclick="applyPreset('daily')">每日发货</button>
                                <button class="pill" onclick="applyPreset('repurchase')">复购率</button>
                                <button class="pill" onclick="applyPreset('customer-value')">客单价</button>
                            </div>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn primary" onclick="generateReport()">生成报表</button>
                        <button class="btn ghost" onclick="clearForm()">清空</button>
                    </div>
                </div>
                <div class="card">
                    <h2>结果展示</h2>
                    <div id="results" class="results"></div>
                </div>
            </div>
        </main>
        <div class="foot">
            <strong>AI 不提供结论性动作，最后那一下由您点。</strong> 每天5分钟，掌握业务动态。
        </div>
    </div>
    <script>
        const SEED = {
            "daily_shipments": 150,
            "repurchase_rate": "35%",
            "average_order_value": "$75",
            "insights": "用户购买高峰在周三，客单价最高的地区是上海。"
        };

        function applyPreset(preset) {
            const presets = {
                "daily": {
                    "data-source": "wechat",
                    "start-date": "2023-10-01",
                    "end-date": "2023-10-31",
                    "scenario-presets": "每日发货"
                },
                "repurchase": {
                    "data-source": "douyin",
                    "start-date": "2023-09-01",
                    "end-date": "2023-09-30",
                    "scenario-presets": "复购率"
                },
                "customer-value": {
                    "data-source": "kuaidi100",
                    "start-date": "2023-08-01",
                    "end-date": "2023-08-31",
                    "scenario-presets": "客单价"
                }
            };
            for (let key in presets[preset]) {
                document.getElementById(key).value = presets[preset][key];
            }
        }

        function clearForm() {
            document.getElementById("data-source").value = "";
            document.getElementById("start-date").value = "";
            document.getElementById("end-date").value = "";
            document.getElementById("scenario-presets").value = "";
            document.getElementById("results").innerHTML = "";
        }

        function generateReport() {
            const dataSource = document.getElementById("data-source").value;
            const startDate = document.getElementById("start-date").value;
            const endDate = document.getElementById("end-date").value;
            const scenarioPresets = document.getElementById("scenario-presets").value;

            const inputs = {
                "data-source": dataSource,
                "start-date": startDate,
                "end-date": endDate,
                "scenario-presets": scenarioPresets
            };

            fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ "inputs": inputs })
            })
            .then(response => response.json())
            .then(data => {
                displayResults(data);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById("results").innerHTML = "<div class='result-card error'>生成失败，请稍后重试。</div>";
            });
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";

            const dailyShipments = data.daily_shipments;
            const repurchaseRate = data.repurchase_rate;
            const averageOrderValue = data.average_order_value;
            const insights = data.insights;

            const dailyShipmentsCard = document.createElement("div");
            dailyShipmentsCard.className = "result-card";
            dailyShipmentsCard.innerHTML = `<h3>每日发货量</h3><p>${dailyShipments}</p>`;
            resultsDiv.appendChild(dailyShipmentsCard);

            const repurchaseRateCard = document.createElement("div");
            repurchaseRateCard.className = "result-card";
            repurchaseRateCard.innerHTML = `<h3>复购率</h3><p>${repurchaseRate}</p>`;
            resultsDiv.appendChild(repurchaseRateCard);

            const averageOrderValueCard = document.createElement("div");
            averageOrderValueCard.className = "result-card";
            averageOrderValueCard.innerHTML = `<h3>客单价</h3><p>${averageOrderValue}</p>`;
            resultsDiv.appendChild(averageOrderValueCard);

            const insightsCard = document.createElement("div");
            insightsCard.className = "result-card";
            insightsCard.innerHTML = `<h3>洞察</h3><p>${insights}</p>`;
            resultsDiv.appendChild(insightsCard);
        }
    </script>
</body>
</html>
