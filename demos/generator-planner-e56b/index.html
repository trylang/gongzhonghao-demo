<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>代州黄酒短视频脚本批量生成器</title>
<style>
:root{
  --bg:#f6f3ee; --card:#fffdfa; --ink:#3a352f; --ink-soft:#756c64; --muted:#8a7f76;
  --accent:#a65d4c; --accent-deep:#6d453a; --accent-soft:#f3e7e1;
  --line:#e6ded3; --line-strong:#d8cdbc;
  --ok:#4a7c59; --warn:#b42318; --info:#4f8cff;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(109,69,58,.08);
  --maxw:1080px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Songti SC",serif;
  line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* hero 顶部价值主张 */
.hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fbf4ee;padding:46px 0 38px;text-align:center}
.hero .kicker{letter-spacing:2px;font-size:12.5px;opacity:.85;margin:0 0 10px}
.hero h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 12px;font-weight:600}
.hero .sub{max-width:720px;margin:0 auto;opacity:.92;font-size:14.5px}
.hero .sub strong{color:#ffe2d3}

/* 区块 / 卡片 */
main{padding:30px 0 56px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px}
.card h2,.panel h2{margin:0 0 4px;font-size:17px;color:var(--accent-deep)}
.card .hint,.panel .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}

/* 双栏布局：左输入卡 / 右结果卡 */
.layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

/* 表单 */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide{grid-column:1/-1}
.field>span,.field>label{font-size:13px;color:var(--ink-soft)}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 按钮 */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary.big{padding:13px 24px;font-size:15.5px}
.btn.ghost{background:var(--accent-soft);color:var(--accent-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 胶囊 / 选项卡 / 标签 */
.pill,.tab,.chip{border:1px solid var(--line);background:#fff;color:var(--accent-deep);padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.pill:hover,.tab:hover,.chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab.active,.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 结果可视化 */
.results{display:grid;gap:16px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
.result-card h3,.result-card h4{margin:0 0 8px;color:var(--accent-deep)}
.result-card .rc-body{white-space:pre-wrap;font-size:14.5px;line-height:1.75}

/* 底部理念 */
.foot{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:22px}
.foot strong{color:var(--accent-deep)}
</style>
</head>
<body>
<div id="data-intake"></div>
<div class="wrap">
  <div class="hero">
    <div class="kicker">AI 赋能内容营销</div>
    <h1>代州黄酒短视频脚本批量生成器</h1>
    <div class="sub">输入一个产品卖点，自动生成 30 秒 / 60 秒口播脚本及分镜，让您的营销内容产出效率提升 10 倍！</div>
  </div>
  <main>
    <div class="layout">
      <div class="card">
        <h2>输入参数</h2>
        <div class="form-grid">
          <div class="field">
            <label>产品卖点</label>
            <input type="text" id="product-feature" placeholder="例如：纯手工酿造，口感醇厚">
          </div>
          <div class="field">
            <label>视频时长</label>
            <select id="video-duration">
              <option value="30">30 秒</option>
              <option value="60">60 秒</option>
            </select>
          </div>
          <div class="field">
            <label>品牌名称</label>
            <input type="text" id="brand-name" placeholder="例如：代州黄酒">
          </div>
          <div class="field">
            <label>目标受众</label>
            <input type="text" id="target-audience" placeholder="例如：都市白领，中老年人">
          </div>
        </div>
        <div class="actions">
          <button class="btn primary big" id="generate-btn">生成脚本</button>
          <button class="btn ghost" id="clear-btn">清空</button>
        </div>
        <div class="pill-list" style="margin-top:16px">
          <button class="pill" data-scenario="1">场景 1: 品牌故事</button>
          <button class="pill" data-scenario="2">场景 2: 产品特点</button>
          <button class="pill" data-scenario="3">场景 3: 客户评价</button>
        </div>
      </div>
      <div class="card">
        <h2>生成结果</h2>
        <div id="results" class="results">
          <div class="result-card" id="script-result" style="display:none">
            <h3>口播脚本</h3>
            <div class="rc-body" id="script-content">点击“生成”按钮以查看结果。</div>
          </div>
          <div class="result-card" id="storyboard-result" style="display:none">
            <h3>分镜脚本</h3>
            <div class="rc-body" id="storyboard-content">点击“生成”按钮以查看结果。</div>
          </div>
        </div>
        <div class="status" id="status-message"></div>
      </div>
    </div>
  </main>
  <div class="foot">
    <strong>AI 不提供结论性动作，最后那一下由您点。</strong> 您的创意与判断是任何 AI 都无法替代的。
  </div>
</div>
<script>
const SEED = {
  "product-feature": "纯手工酿造，口感醇厚",
  "video-duration": "30",
  "brand-name": "代州黄酒",
  "target-audience": "都市白领，中老年人"
};

window.DATA_SCHEMA = {
  name: "代州黄酒产品信息",
  columns: [
    {key:"product-feature", label:"产品卖点", type:"text", example:"纯手工酿造，口感醇厚", required:true},
    {key:"video-duration", label:"视频时长", type:"select", options:["30","60"], required:true},
    {key:"brand-name", label:"品牌名称", type:"text", example:"代州黄酒", required:true},
    {key:"target-audience", label:"目标受众", type:"text", example:"都市白领，中老年人", required:true}
  ],
  sample: [
    {"product-feature":"传统工艺酿造","video-duration":"60","brand-name":"代州黄酒","target-audience":"中老年人"},
    {"product-feature":"独特风味","video-duration":"30","brand-name":"代州黄酒","target-audience":"都市白领"}
  ],
  maxRows: 300
};

document.getElementById("generate-btn").addEventListener("click", () => {
  const inputs = {
    "product-feature": document.getElementById("product-feature").value.trim(),
    "video-duration": document.getElementById("video-duration").value,
    "brand-name": document.getElementById("brand-name").value.trim(),
    "target-audience": document.getElementById("target-audience").value.trim()
  };

  if (!inputs["product-feature"] || !inputs["brand-name"]) {
    alert("请填写产品卖点和品牌名称");
    return;
  }

  document.getElementById("status-message").innerText = "生成中...";
  document.getElementById("script-result").style.display = "none";
  document.getElementById("storyboard-result").style.display = "none";

  if (window.DataIntake && window.DataIntake.isReady()) {
    inputs.data = window.DataIntake.getPayload();
  }

  fetch("/api/generate", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({inputs: inputs})
  })
  .then(response => response.json())
  .then(data => {
    if (data.script) {
      document.getElementById("script-content").innerText = data.script;
      document.getElementById("script-result").style.display = "block";
    }
    if (data.storyboard) {
      document.getElementById("storyboard-content").innerText = data.storyboard;
      document.getElementById("storyboard-result").style.display = "block";
    }
    document.getElementById("status-message").innerText = "";
  })
  .catch(error => {
    console.error("Error:", error);
    document.getElementById("status-message").innerText = "生成失败，请重试。";
  });
});

document.getElementById("clear-btn").addEventListener("click", () => {
  document.getElementById("product-feature").value = "";
  document.getElementById("video-duration").value = "30";
  document.getElementById("brand-name").value = "";
  document.getElementById("target-audience").value = "";
  document.getElementById("script-result").style.display = "none";
  document.getElementById("storyboard-result").style.display = "none";
  document.getElementById("status-message").innerText = "";
});

document.querySelectorAll(".pill").forEach(pill => {
  pill.addEventListener("click", () => {
    const scenario = pill.getAttribute("data-scenario");
    const scenarios = {
      "1": {
        "product-feature": "代州黄酒，传承百年工艺",
        "video-duration": "60",
        "brand-name": "代州黄酒",
        "target-audience": "中老年人"
      },
      "2": {
        "product-feature": "纯手工酿造，品质保证",
        "video-duration": "30",
        "brand-name": "代州黄酒",
        "target-audience": "都市白领"
      },
      "3": {
        "product-feature": "顾客好评如潮",
        "video-duration": "30",
        "brand-name": "代州黄酒",
        "target-audience": "广泛人群"
      }
    };
    if (scenarios[scenario]) {
      document.getElementById("product-feature").value = scenarios[scenario]["product-feature"];
      document.getElementById("video-duration").value = scenarios[scenario]["video-duration"];
      document.getElementById("brand-name").value = scenarios[scenario]["brand-name"];
      document.getElementById("target-audience").value = scenarios[scenario]["target-audience"];
    }
  });
});
</script>
</body>
</html>
