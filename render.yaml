# Render Blueprint — gongzhonghao-demo 单体仓库
# 约定：每个 demo 放在 demos/<name>/ 下，各自是一个独立 Render 服务（独立 URL）。
# 新增 demo 时：在 demos/ 下加一个文件夹（自带 package.json + server.js），
# 然后在本文件 services: 下加一段同样的配置（改 name / rootDir 即可），
# 并务必把 MINIMAX_API_KEY 那段（sync: true + value）一起复制过来——否则新服务部署后会缺 key。
# 部署：Render 连接本仓库后，自动按此文件创建/更新各服务。
#
# ⚠️ MINIMAX_API_KEY 的 value 单一来源 = 本文件（任意一处即可）。轮换 key 时只改本文件里所有
#    `value: sk-cp-...` 行（一次性 find/replace 全部替换）即可；add_demo.sh 会自动从本文件读
#    取 value，skill 文档也不再硬编码，无需同步其他位置。

services:
  - type: web
    name: huangjiu-content-generator
    runtime: node
    plan: free
    branch: main
    rootDir: demos/content-generator
    buildCommand: "echo 'no build needed'"
    startCommand: "node server.js"
    healthCheckPath: "/"
    envVars:
      - key: MINIMAX_API_KEY
        sync: true
        value: sk-cp-6TsmFqQh8no8k0od-0zXJoUxkpdJo2NeDUDHjbZeyDNhdWV3bN8EiJ1GMwPZS6Wlx-Q1imUMG0hKS9wbvRdqlxdGBxMNJher2J32Q48m8p0ALfB_LBfQ6BU
    # 注意：PORT 由 Render 自动注入，server.js 用 process.env.PORT 读取，勿在此固定

  - type: web
    name: huangjiu-after-sales
